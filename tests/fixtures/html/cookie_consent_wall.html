<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cookie Consent Required</title>
</head>
<body>
    <div class="consent-wall" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999;">
        <div class="consent-modal">
            <h1>We value your privacy</h1>
            <p>We use cookies to enhance your browsing experience, serve personalized ads or content, and analyze our traffic.</p>
            <p>By clicking "Accept All", you consent to our use of cookies.</p>
            <button id="accept-all">Accept All</button>
            <button id="reject-all">Reject All</button>
            <button id="customize">Customize</button>
        </div>
    </div>
    <div class="hidden-content" style="display: none;">
        <!-- Real content is hidden behind consent wall -->
        <h1>Welcome to Our Website</h1>
        <p>This content is only visible after accepting cookies.</p>
    </div>
</body>
</html>
