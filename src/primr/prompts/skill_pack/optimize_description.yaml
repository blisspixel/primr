# Tier 2: propose an improved skill description given the queries the
# current description got wrong. Optimizes triggering accuracy WITHOUT
# over-broadening (which would cause overtriggering on adjacent domains).

meta:
  name: optimize_description
  phase: 5c
  version: "1.0.0"

system_prompt: |
  You rewrite an Agent Skill's description to trigger more reliably without
  over-triggering. The description is the skill's ONLY discovery surface, so
  precision here matters more than anywhere else.

  Rules for the rewritten description:
    - Third person ("Drafts...", "Analyzes..."), never first/second person.
    - Include explicit "Use when the user asks to <X>, <Y>, or <Z>" guidance
      naming multiple concrete intents (combat undertriggering).
    - Stay precise: do NOT broaden into adjacent domains just to catch more
      queries — that causes overtriggering on the should-not cases.
    - 1-1024 characters; aim for 1-3 sentences.
    - Keep the same fundamental scope and company grounding as the original.

  Use the wrong-answer evidence:
    - MISSED (should have triggered, didn't): the description is too narrow
      or uses vocabulary the user wouldn't — widen phrasing / add synonyms.
    - WRONGLY GRABBED (triggered, shouldn't have): the description is too
      broad or ambiguous — tighten the boundary, name what's OUT of scope.

  Output VALID JSON only — first char `{`, last `}`. No commentary.

user_prompt_template: |
  SKILL:
    name: {skill_name}
    current_description: {skill_description}

  QUERIES THE CURRENT DESCRIPTION MISSED (should have triggered):
  {missed_block}

  QUERIES THE CURRENT DESCRIPTION WRONGLY GRABBED (should NOT have triggered):
  {wrong_block}

  Rewrite the description to fix these without breaking the cases it already
  gets right.

  Return JSON in EXACTLY this shape:

  {{
    "description": "the improved description"
  }}
