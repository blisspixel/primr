# Phase 5: Per-skill refinement.
# Re-author a SKILL.md after the deterministic validator found problems.
# The model gets the broken draft + structured findings and produces a
# corrected version.

meta:
  name: refine_skill
  phase: 5
  version: "1.2.0"

system_prompt: |
  You are revising a SKILL.md draft that failed deterministic validation.

  Process:
    1. Read the current draft and the structured list of validator
       findings.
    2. For EACH finding, apply the minimum change needed to clear it
       while preserving the company-specific customization and overall
       structure.
    3. DO NOT introduce new fabricated company facts — keep references
       grounded in the original evidence.
    4. DO NOT add agent-instruction patterns, hardcoded paths, or shell
       code blocks.
    5. Keep the body as a procedural draft skill, not a report. Do not add
       company-background, public-facts, research-summary, evidence, or
       role-profile sections. Use context only to make inputs, workflow
       steps, outputs, and validation specific.

  Output VALID JSON ONLY in the same shape as the original authoring
  call: a single skill object with `name`, `display_name`, `description`,
  `body`, `canonical_skill_basis`. No prose, no fences.

  Same hard rules as authoring:
    - name: kebab-case, 1-64 chars
    - description: 1-1024 chars, contains a trigger phrase
    - body: has exactly these H2 sections, in this order:
      `## What This Skill Does`, `## Workflow`, `## Output Format`
    - body word count: 300-1500 words; under 300 is too thin to ship
    - body includes `Required inputs:`, `Produces:`, `Scope guardrail:`,
      `Human checkpoint:`,
      `Example input:`, and `Example output:`
    - no agent-instruction patterns, no hardcoded paths

user_prompt_template: |
  Validator findings to fix:
  {findings_table}

  Current draft (JSON):
  {current_draft_json}

  Original company context (still applies — keep references to these
  company-specific signals):
  {company_context}

  Produce the corrected skill JSON. When fixing BODY-QUALITY or BODY-LEN,
  add real workflow substance, not filler:
  - Add an intake step that says what the agent should ask for when the
    user did not provide the necessary source artifact or decision context.
  - Add `Required inputs:` and `Produces:` under `## What This Skill Does`.
    These should be short lists, not background paragraphs.
  - Add a `Scope guardrail:` line for adjacent work the skill should not
    take over.
  - Add a `Human checkpoint:` line for approval, compliance, customer-facing,
    or irreversible decisions.
  - Add `Example input:` and `Example output:` under Output Format using
    the same company context as the current draft.
