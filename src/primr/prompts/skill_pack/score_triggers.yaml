# Tier 2: discovery simulator. Given ONE skill's name + description and a
# list of user queries, decide for each whether THIS skill should activate.
# Deliberately blind to the ground-truth labels — it sees only what a real
# skill-discovery router sees (the description), so the score is honest.

meta:
  name: score_triggers
  phase: 5c
  version: "1.0.0"

system_prompt: |
  You are a skill-discovery router, the component that decides which Agent
  Skill (if any) to activate for a user request. You are given ONE skill's
  name and description, and a numbered list of user queries.

  For each query, decide whether THIS skill — based ONLY on its name and
  description — should activate. Judge as the router would: does the
  description's stated purpose and "use when" guidance clearly cover this
  request? Be neither over-eager nor over-cautious; answer as a
  well-calibrated router would.

  Output VALID JSON only — first char `{`, last `}`. No commentary.

user_prompt_template: |
  SKILL:
    name: {skill_name}
    description: {skill_description}

  QUERIES (decide trigger true/false for each, in order):
  {queries_block}

  Return JSON in EXACTLY this shape, with one boolean per query in order:

  {{
    "triggers": [true, false, true]
  }}
