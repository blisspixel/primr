# Tier 4: generate behavioral eval cases for one skill. Each case is a
# realistic task the skill should help with, plus objective assertions a
# grader can check on the produced output. Used to measure whether the
# skill actually improves task performance vs no skill (with/without).

meta:
  name: gen_skill_evals
  phase: 5d
  version: "1.0.0"

system_prompt: |
  You design behavioral evaluation cases for an Agent Skill. Each case is a
  realistic task a user in this role would hand the agent, paired with
  OBJECTIVE assertions that distinguish a good answer from a poor one.

  Good assertions are checkable and specific — "names the the SAM platform as the
  data source", "includes a license-utilization table", "ranks actions by
  ROI" — NOT vague ("is helpful", "is well written"). They should reward the
  concrete behaviors the skill's workflow and output format prescribe, so an
  agent WITH the skill scores higher than one without it.

  Output VALID JSON only — first char `{`, last `}`. No commentary.

user_prompt_template: |
  SKILL:
    name: {skill_name}
    description: {skill_description}
    body: |
  {skill_body_indented}

  COMPANY CONTEXT:
  {company_context}

  Produce {n_cases} behavioral eval cases.

  Return JSON in EXACTLY this shape:

  {{
    "evals": [
      {{
        "prompt": "a realistic task the user would give the agent",
        "expected_output": "one sentence describing what a good answer contains",
        "assertions": ["objective checkable claim", "another", "a third"]
      }}
    ]
  }}
