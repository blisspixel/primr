# Company Strategic Overview Prompt Configuration
# This file defines the structure and content requirements for company research reports.
#
# Purpose: Internal prep to understand a company before discovery conversations.
# Goal: Form hypotheses about how they create value and where support could help.
# Audience: Consultants preparing for client meetings.

meta:
  name: "Strategic Company Overview"
  version: "1.1.0"
  description: "Comprehensive company research for pre-meeting preparation"
  output_format: "markdown"
  expected_pages: "20-70"
  
# Dependencies on shared components:
#   - shared/epistemic_rules.yaml
#   - shared/formatting.yaml
#   - shared/personas.yaml
  
document_purpose: |
  This is INTERNAL PREP to understand the company before a discovery conversation. The goal is to:
  1. Understand how they create value today
  2. Form hypotheses about where support could help them move faster, reduce risk, or unlock opportunities
  3. Surface smart questions to validate our thinking WITH them
  
  This is NOT a client deliverable. It's the thinking that makes you walk in informed and curious.
  Write with analytical depth. Surface uncomfortable hypotheses. Prioritize clarity over diplomacy.
  Treat strong claims as working hypotheses unless explicitly supported by cited sources.
  
  IMPORTANT - Avoid Repetition:
  Each insight should live in ONE section. Don't repeat the same point across SWOT, Strategic 
  Tensions, Fragilities, and Patterns. Pick the best home for each idea and develop it there.
  Cross-reference other sections rather than restating.

epistemic_rules:
  confidence_labeling: |
    REQUIRED: Label every significant claim with confidence level:
    - **Confirmed**: From official filings, company statements, or verified sources
    - **Reported**: From credible third-party sources (news, analysts) but not verified
    - **Estimated**: Calculated or inferred from available data
    - **Hypothesis**: Our interpretation or speculation to validate
    
    Example: "Revenue of ~$1B (Reported - market sources, Sept 2025)"
    Example: "EBITDA margin of ~40% (Estimated - calculated from reported figures)"
    Example: "Integration debt may be limiting R&D velocity (Hypothesis)"
  fact_inference_hypothesis: |
    Distinguish facts (with citations) from inferences (labeled as such) from hypotheses (to validate).
    Never state a hypothesis as if it were confirmed fact.
  risk_framing: |
    Frame risks as "areas to explore" not definitive threats.
  language: |
    Use language like "appears to", "worth exploring", "we'd want to validate".
  transformation_rule: |
    If a sentence implies inevitability or failure, rewrite it as a scenario comparison.
  numeric_precision: |
    For numbers not directly from filings or official sources:
    - Use ranges: "$800M-$1.2B" not "$1B"
    - Soften phrasing: "reported," "management commentary suggests," "estimated at"
    - Note the source and date: "(per industry reports, Q3 2024)"
    This protects credibility if challenged. Overconfident precision undermines trust.
  measurement_uncertainty: |
    For impacts that are necessarily speculative (conversion rates, attribution, ROI projections),
    explicitly acknowledge measurement uncertainty: "If tracking exists...", "Absent strong 
    attribution, this may function primarily as...", "The actual impact depends on..."
  avoid_overreach: |
    Do NOT:
    - State internal priorities or board decisions as if you have inside knowledge
    - Claim precise market share in opaque markets
    - Assert causal certainty ("X enables Y, therefore Z will happen")
    - Present speculation about internal dynamics as confirmed
    
    DO:
    - Frame internal dynamics as hypotheses: "If PE exit pressure is driving decisions..."
    - Acknowledge what you can't know from outside: "Internal prioritization is unclear"
    - Use conditional language: "This could suggest..." not "This proves..."

formatting:
  paragraphs: "Write in full paragraphs with evidence"
  bullets: "Use bullets only for lists of specific items"
  bullet_depth: "Single-level bullets only"
  citations: "Cite sources at section end using [cite: X, Y, Z] format"
  tables: "Include tables for financials, competitors, timelines"

key_metrics:
  format: |
    **Key Metrics:**
    - Employees: [X,XXX or ~X,XXX estimated]
    - Revenue: [$X.XB or ~$XXM estimated]
    - Founded: [YYYY]
    - Headquarters: [City, State]

sections:
  - id: executive_summary
    name: "Executive Summary"
    part: 1
    position: opening  # opening, middle, or closing - for narrative flow
    purpose: "Strategic synthesis a partner reads before walking into the meeting"
    covers:
      - "What this company does and their market position (2-3 paragraphs)"
      - "Key financial metrics and growth trajectory with specific numbers"
      - "What they appear to be good at - their core competitive advantages"
      - "2-3 areas where consulting support could create meaningful impact"
      - "The central hypothesis about how they create value (to validate with them)"
    depth: |
      This should be 2-3 pages of substantive analysis, NOT a bullet list.
      Write in flowing prose. Synthesize the document's key insights.
      Do not introduce conclusions not explored in later sections.
      Do NOT use labels like "The 'So What'" - just write the analysis directly.

  - id: products_services
    name: "Products and Services"
    part: 1
    position: middle
    purpose: "Understand what they actually sell and how they make money"
    covers:
      - "Complete product/service catalog organized by category"
      - "How each offering generates revenue (pricing models, contract structures)"
      - "Revenue mix across product lines (if discernible)"
      - "Recent launches, discontinuations, or pivots (last 2-3 years)"
      - "Technology or platform underpinning their offerings"
      - "Go-to-market and fulfillment approach"
    depth: "Include specific product names, features, and positioning. A consultant should understand their entire offering."

  - id: target_customers
    name: "Target Customers"
    part: 1
    position: middle
    purpose: "Understand who they serve and how they reach them"
    covers:
      - "Primary customer segments with size/revenue estimates"
      - "Buyer personas and purchasing behavior"
      - "Geographic distribution of customer base"
      - "Industry verticals served (with relative importance)"
      - "Enterprise vs SMB vs consumer mix"
      - "Channel strategy and key partners"
    depth: "Thorough segmentation analysis"

  - id: competitive_differentiation
    name: "Competitive Differentiation"
    part: 1
    position: middle
    purpose: "Understand why customers choose them over alternatives"
    covers:
      - "Primary value proposition and core messaging"
      - "Specific capabilities competitors demonstrably lack"
      - "Evidence of differentiation (customer reviews, case studies, analyst commentary)"
      - "Durability of the moat - what protects it, what could erode it"
    depth: "Evidence-based analysis of their competitive advantages"

  - id: financial_profile
    name: "Financial Profile"
    part: 1
    position: middle
    purpose: "Understand their economic reality"
    covers:
      - "Revenue (actual or estimated with source and confidence)"
      - "Revenue growth rate and multi-year trajectory"
      - "Profitability indicators (margins, EBITDA if available)"
      - "Funding history with investors, dates, amounts"
      - "Current valuation (if known)"
      - "Capital structure and debt profile"
    depth: |
      REQUIRED: Include a financial summary table with columns for Metric, Value, 
      Source, and Confidence Level. If public financials unavailable, estimate 
      using employee count, funding rounds, and market signals. Always note 
      confidence level for each data point.

  - id: company_history
    name: "Company History and Evolution"
    part: 1
    position: middle
    purpose: "Understand how they got here"
    covers:
      - "Founding story and original business model"
      - "Major pivots or strategic shifts (with context on why)"
      - "All significant acquisitions (dates, deal sizes if known, strategic rationale)"
      - "Key leadership transitions"
      - "Funding milestones"
      - "Geographic expansion"
    depth: |
      REQUIRED: Include a timeline table with columns for Year, Event, and 
      Significance. For companies with complex histories (10+ years, multiple 
      pivots, or significant M&A), this section should be 2-3 pages.

  - id: leadership_organization
    name: "Leadership and Organization"
    part: 1
    position: middle
    purpose: "Understand who runs the company and how they operate"
    covers:
      - "C-suite profiles with backgrounds, tenure, previous roles"
      - "Board composition and notable directors"
      - "Leadership stability (recent departures, average tenure)"
      - "Cultural signals from careers page, press, employee reviews"
    depth: "Comprehensive leadership analysis"

  - id: industry_dynamics
    name: "Industry Dynamics"
    part: 2
    position: middle
    purpose: "Understand the forces shaping their world"
    covers:
      - "Industry size, growth rate, and trajectory"
      - "Key trends and disruption factors"
      - "Regulatory environment and upcoming changes"
      - "Technology shifts affecting the industry"
      - "Consolidation or fragmentation trends"
    depth: "Thorough industry analysis"

  - id: competitive_landscape
    name: "Competitive Landscape"
    part: 2
    position: middle
    purpose: "Understand who they're fighting and how they stack up"
    covers:
      - "Direct competitors with brief profiles"
      - "Market share estimates (with sources)"
      - "Head-to-head comparison on key dimensions"
      - "Where they appear to win deals (and why)"
      - "Where they appear to lose deals (and why)"
      - "Emerging competitors or disruptors to watch"
    depth: |
      REQUIRED: Include a competitor comparison table with at least 5 competitors.
      Columns should include: Company, Revenue/Size, Key Strengths, Key Weaknesses,
      Market Position. This section should be 3-5 pages with substantive analysis
      of competitive dynamics, not just a list.

  - id: business_model
    name: "Business Model and Value Creation"
    part: 3
    position: framework
    purpose: "Articulate how they actually make money - the logic made explicit"
    covers:
      - "Core value proposition: What problem, for whom, better than alternatives?"
      - "Revenue model and unit economics (if discernible)"
      - "Reinforcing mechanisms: What creates flywheel effects?"
      - "Key assumptions: What must remain true for this model to work?"
      - "Vulnerabilities: Where could the logic break down?"
    depth: "Frame as an initial theory to test in conversation"

  - id: swot_analysis
    name: "SWOT Analysis"
    part: 3
    position: framework
    purpose: "Structured assessment of position - the canonical home for strengths, weaknesses, opportunities, threats"
    covers:
      - "Strengths (internal capabilities and advantages) - 4-6 items with evidence"
      - "Weaknesses (internal gaps and limitations) - 4-6 items with evidence"
      - "Opportunities (external openings and tailwinds) - 4-6 items with evidence"
      - "Threats (external risks and headwinds) - 4-6 items with evidence"
    depth: |
      This is the CANONICAL HOME for position assessment. Do NOT repeat these points 
      in Strategic Tensions, Fragilities, or Patterns - those sections should build 
      on SWOT, not duplicate it.
      
      For each item:
      - State the strength/weakness/opportunity/threat clearly
      - Provide specific evidence (numbers, examples, citations)
      - Explain strategic significance in 1-2 sentences
      
      Keep this section focused and evidence-based. Save the "what to do about it" 
      for Strategic Tensions and Discovery Questions.

  - id: strategic_tensions
    name: "Strategic Tensions"
    part: 3
    position: framework
    purpose: "Identify core tensions they must actively manage - derived from SWOT"
    covers:
      - "3-5 tensions that emerge from the SWOT analysis"
      - "For each: The tension, Evidence, Current approach, Question to explore"
    depth: |
      This section BUILDS ON SWOT - don't repeat the same points, synthesize them into tensions.
      A tension is a tradeoff they must manage, not just a weakness restated.
      Examples: Scale vs customization, Speed vs governance, Growth vs profitability
      Reference the SWOT section rather than restating evidence.

  - id: constraints_freedom
    name: "Constraints and Degrees of Freedom"
    part: 3
    position: middle
    purpose: "Understand what's changeable vs fixed"
    covers:
      - "Structural Constraints: Regulatory, legacy systems, contracts, capital structure, cultural inertia"
      - "Degrees of Freedom: Decisions that appear genuinely open, areas where small changes could have outsized impact"
    depth: "Specific evidence for each constraint and freedom"

  - id: narrative_gaps
    name: "Narrative Gap Analysis"
    part: 4
    position: middle
    purpose: "Contrasts between what they say and external signals"
    covers:
      - "4-6 gaps identified"
      - "For each: Claim (with quote/source), Evidence (external signals), Question to explore"
    depth: "Observations to explore, not accusations"

  - id: fragilities
    name: "Areas of Potential Fragility"
    part: 4
    position: middle
    purpose: "System-level vulnerabilities not captured in SWOT threats"
    covers:
      - "3-4 fragilities that represent systemic risk, not just threats"
      - "For each: The fragility, Evidence, Question about how they're thinking about it"
    depth: |
      This is for SYSTEMIC fragilities - things that could cascade or compound.
      Don't repeat SWOT threats here. Focus on:
      - Single points of failure
      - Concentration risks
      - Dependencies that could break under stress
      If it's already in SWOT Threats, don't repeat it here.

  - id: patterns
    name: "Patterns Worth Exploring"
    part: 4
    position: middle
    purpose: "Interesting patterns that don't fit neatly into other sections"
    covers:
      - "3-5 patterns that are genuinely novel observations"
      - "For each: Observation (with evidence), Interpretation A, Interpretation B, Question"
    depth: |
      This is for NOVEL patterns not already covered elsewhere.
      Don't restate SWOT items or Strategic Tensions as "patterns."
      Focus on:
      - Surprising correlations
      - Timing patterns
      - Behavioral signals
      - Things that don't quite fit the narrative
      If you've already made the point elsewhere, don't repeat it here.

  - id: discovery_questions
    name: "Discovery Questions"
    part: 4
    position: middle
    purpose: "The most important questions for our first conversation"
    covers:
      - "6-8 questions"
      - "For each: The question, Why we're asking, What we hope to learn"
    depth: "Specific and thoughtful, not gotcha questions"

  - id: engagement_opportunities
    name: "Where They're Likely to Say Yes"
    part: 4
    position: middle
    purpose: "Tie hypotheses to decision ownership and budget reality"
    covers:
      - "Budget-Adjacent Areas: Where spend is already happening or planned"
      - "Budget-Resistant Areas: Where we'd need to create the case from scratch"
      - "Decision Ownership: Who owns each area (CFO, CTO, Head of X)"
      - "Time Horizon: 2025 priorities vs 2026+ strategic bets"
    depth: |
      This is the "so what for us" section. Connect the analysis to:
      - Specific decision-makers and their likely priorities
      - Revenue vs efficiency vs defensive spend categories
      - Near-term budget cycles vs longer-term strategic planning
      Be realistic about where there's likely appetite vs where we'd be pushing uphill.

  - id: porters_five_forces
    name: "Porter's Five Forces Assessment"
    part: 5
    position: framework
    purpose: "Understand industry profitability dynamics"
    covers:
      - "Threat of new entrants (High/Medium/Low with evidence)"
      - "Bargaining power of suppliers"
      - "Bargaining power of buyers"
      - "Threat of substitutes"
      - "Competitive rivalry"
    depth: "Each force assessed with specific evidence"

  - id: value_chain
    name: "Value Chain Analysis"
    part: 5
    position: framework
    purpose: "Where in the value chain do they participate and capture margin?"
    covers:
      - "Primary activities and where they have advantages"
      - "Potential for vertical integration or disintermediation"
    depth: "Connect to their competitive position"

  - id: strategic_positioning
    name: "Strategic Positioning Hypothesis"
    part: 5
    position: closing  # This is the final section - ties everything together
    purpose: "Initial hypothesis about their strategic position"
    covers:
      - "Are they competing on cost leadership, differentiation, or focus?"
      - "Is their strategy coherent (do the pieces reinforce each other)?"
      - "Where might the strategy be under pressure?"
    depth: "Frame explicitly as a hypothesis to validate in conversation"

# =============================================================================
# ACCORDION METHOD PROMPTS
# =============================================================================
# These prompts are used by the Accordion Method for generating comprehensive reports.
# Phase 1: Research Dossier - Deep Research gathers raw facts
# Phase 2: Section Writing - Gemini Pro writes each section with context continuity

accordion_method:
  # Phase 1: Research Dossier prompt
  # Deep Research acts as "Lead Researcher" gathering raw facts, not writing prose
  research_dossier_prompt: |
    You are a Lead Researcher compiling a research dossier on {company_name}{website_context}.

    I am writing a 30-page strategic company overview. I do NOT want the final report yet.
    I want a comprehensive Research Dossier containing raw facts and data.

    You have access to initial research findings uploaded to File Search Store.
    Use that as your starting point - it contains verified information from the company's website.
    Your job is to EXPAND on that with external research: news, analyst reports, industry data.

    Compile the following:

    1. COMPANY BASICS
       - Official name, headquarters, founding date
       - Employee count (with source and date)
       - Revenue figures (with source, date, and confidence level)
       - Ownership structure (public/private, key investors)

    2. PRODUCTS AND SERVICES
       - Complete list of products/services with descriptions
       - Pricing information if available
       - Recent launches or discontinuations (last 2-3 years)

    3. CUSTOMERS AND MARKETS
       - Target customer segments
       - Geographic markets served
       - Key customer names if public
       - Industry verticals

    4. COMPETITIVE LANDSCAPE
       - Top 5-10 competitors with brief descriptions
       - Market share data if available
       - Competitive positioning signals

    5. FINANCIAL DATA
       - Revenue history (multi-year if available)
       - Growth rates
       - Profitability indicators
       - Funding rounds (for private companies)
       - Stock performance (for public companies)

    6. LEADERSHIP
       - C-suite executives with backgrounds
       - Board members
       - Recent leadership changes

    7. INDUSTRY CONTEXT
       - Industry size and growth rate
       - Key trends affecting the industry
       - Regulatory factors

    8. STRATEGIC SIGNALS
       - Recent news and announcements
       - Partnerships and acquisitions
       - Strategic initiatives mentioned in press

    OUTPUT FORMAT: Detailed markdown notes organized by section above.
    Include specific numbers, dates, and citations for every fact.
    Note confidence levels (confirmed/estimated/unclear) for key figures.
    Do NOT write polished prose - this is raw research material.

  # Phase 2: Section Writing prompt template
  # Used for each section, with variables substituted at runtime
  section_writing_prompt: |
    You are writing a section of a strategic company overview for {company_name}.
    
    PURPOSE: This is for internal sensemaking and go-to-market preparation - helping 
    us understand how this company creates value and where we might help them. It's 
    NOT a client deliverable. Frame insights as hypotheses to explore, not conclusions.

    {stage1_context}

    ## RESEARCH DOSSIER (Deep Research Findings)
    The research dossier below contains compressed facts gathered by Deep Research.
    Your job is to take these facts and write them out properly - developing the 
    analysis, surfacing implications, and identifying patterns worth exploring.

    {research_dossier}

    ## PREVIOUS SECTIONS (for narrative continuity)
    {previous_sections}

    ## YOUR TASK
    Write the **{section_title}** section.

    Instructions:
    {section_instructions}

    ## NARRATIVE GUIDANCE
    {position_guidance}

    ## WRITING APPROACH
    
    This is exploratory analysis, not authoritative prescription:
    - Frame findings as hypotheses: "This suggests..." not "They must..."
    - Surface patterns worth exploring, questions to ask
    - Be specific with evidence (numbers, names, comparisons)
    - Acknowledge uncertainty - what we don't know matters too
    - Write for someone preparing to engage, not delivering a verdict
    
    CONFIDENCE LABELING (REQUIRED):
    Label significant claims with confidence level:
    - **Confirmed**: Official filings, company statements, verified sources
    - **Reported**: Credible third-party sources but not verified
    - **Estimated**: Calculated or inferred from available data  
    - **Hypothesis**: Our interpretation to validate in conversation
    
    Examples:
    - "Revenue of ~$1B (Reported - market sources, Sept 2025)"
    - "EBITDA margin of ~40% (Estimated - calculated from reported figures)"
    - "Integration debt may be limiting R&D velocity (Hypothesis)"
    
    NUMERIC PRECISION:
    - For numbers from filings/official sources: state directly with source
    - For estimates: use ranges ("$800M-$1.2B") and note source
    - For speculative impacts: acknowledge measurement uncertainty explicitly
    
    AVOID OVERREACH:
    - Don't state internal priorities as if you have inside knowledge
    - Don't claim precise market share in opaque markets
    - Don't assert causal certainty - use conditional language
    - Frame internal dynamics as hypotheses, not facts
    
    AVOID REPETITION:
    - Check the previous sections - don't restate points already made
    - Each insight should live in ONE section
    - Reference other sections rather than restating: "As noted in the SWOT analysis..."
    
    Write as much as the content needs - no more, no less. Let the material guide you.
    
    GOOD:
    - "NIM of 2.46% vs First Hawaiian's 3.19% (Confirmed - Q3 filings) suggests potential pricing constraints worth exploring"
    - "The Cetera partnership may signal a pivot toward fee income (Hypothesis) - worth validating in conversation"
    - "Revenue estimated at $800M-$1.2B (Reported - industry sources vary)"
    
    NOT THIS:
    - "They must improve their margins" (too prescriptive)
    - "Revenue is exactly $1.03B" (false precision without source)
    - "The board has decided to prioritize X" (claiming inside knowledge)
    
    Use natural section titles (not numbered). Cite sources with [cite: X] format.

    Write the **{section_title}** section now:

  # Position guidance templates for narrative flow
  position_guidance:
    opening: |
      This is the OPENING section. Set the exploratory tone for the report.
      Surface the key hypotheses that subsequent sections will develop.
    middle: |
      This is section {section_number} of {total_sections}.
      Build naturally on the previous sections. Reference earlier points where relevant.
      Develop themes and surface questions worth exploring.
    framework: |
      This is a FRAMEWORK section - apply the analytical framework rigorously.
      Consulting frameworks like SWOT, Porter's Five Forces, and Value Chain are 
      valuable because they structure thinking and surface insights. Use them well:
      - Apply each element of the framework systematically
      - Ground every assessment in specific evidence from the research
      - Draw out implications - what does each finding suggest?
      - Connect to the broader strategic picture
      This is where structured analysis adds real value.
    closing: |
      This is the CLOSING section. Synthesize the key hypotheses and patterns.
      Highlight the most important questions to explore in engagement.
