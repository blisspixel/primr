# AI Strategy Prompt Configuration
#
# Purpose: Business-first AI strategy and board decision support.
# Goal: Answer "Where can AI create durable business value, what should leadership
# decide, and what operating and technology choices make that value achievable?"
# Audience: CEO, CIO, board, executive leadership, and accountable business owners.

meta:
  name: "Business-First AI Strategy"
  version: "2.2.0"
  description: "Evidence-grounded enterprise AI strategy that preserves a complete company-specific opportunity inventory, prioritizes transparently, and translates current AI developments into ideas without fabricating company facts"
  output_format: "markdown"
  output_filename: "{company_name}_AI_Strategy"
  expected_pages: "18-30"

persona: "ai_strategist"

document_purpose: |
  Produce transparent decision support for the CEO, CIO, board, and accountable
  business leaders. Start with the company's strategy, economic engine, and capital
  choices, not with an AI product catalog. The governing question is where better
  decisions, automation, prediction, generation, or machine perception could
  materially improve:

  - Revenue growth, retention, pricing, and market expansion
  - Margin, cost to serve, throughput, cycle time, quality, and working capital
  - Existing products and services, or credible new offerings and business models
  - Customer, partner, and employee experience
  - Risk, compliance, safety, resilience, and decision quality

  AI is one possible means, not the objective. It is acceptable to conclude that a
  conventional software, analytics, process, or policy change is better for a given
  problem. Distinguish table-stakes adoption from capabilities that could become a
  durable advantage for this specific company.

  This is outside-in preparation based on public and operator-supplied evidence. It
  must not pretend to know internal priorities, budgets, architecture, adoption, or
  risk tolerance that have not been supplied. Recommendations are hypotheses and
  choices to validate, with assumptions and disconfirming conditions made visible.

  The document must expand the Strategic Overview into an enterprise performance
  agenda. Trace company strategy and industry change into choices about profitable
  growth, margin and productivity, stronger products and services, new business
  models, customer and workforce outcomes, resilience, and risk. It must help leaders
  decide what to fund, what to test, what not to do, who owns each outcome, and what
  evidence would change the decision. It must never use covert persuasion,
  misattribute authorship, manufacture urgency, or present a favored vendor as the
  inevitable answer.

context_instructions: |
  Use the available context extensively, but preserve its evidence strength.

  EVIDENCE ORDER:
  1. Operator-supplied discovery notes are the strongest available evidence of
     internal priorities and constraints, while still representing the perspective
     of the people who supplied them.
  2. The Strategic Overview is the primary synthesis of company strategy, customers,
     products, economics, competition, tensions, risks, and public evidence.
  3. Recon and hiring artifacts are direct public signals. They can reveal configured
     domain services, advertised roles, and requested skills, but they do not prove
     active production use, license scope, primary architecture, organizational
     maturity, or future intent.
  4. Current first-party company materials, official statistics, standards, filings,
     primary research, and official product documentation support external claims.
  5. Vendor research is secondary context for current capabilities and names. It must
     not override company evidence or turn the report into a vendor pitch.

  Build an evidence basis before recommendations. For material observations, state
  the source type, confidence, implication, uncertainty, and validation question.
  Surface contradictions rather than silently choosing the most convenient source.

  Create a complete observed-stack inventory when signals exist. Cover productivity
  and collaboration, identity and security, public cloud and hosting, data and
  analytics, AI and model providers, CRM/ERP/HR and other enterprise applications,
  integration and developer tooling, file/content systems, and private data-center,
  edge, or accelerated-compute signals. "No signal" means unknown, not absent.

  Create a technology-signal disposition ledger before recommending architecture.
  Every relevant observed service, provider, platform, or infrastructure signal must
  be included, marked immaterial to the current decisions, or marked unknown pending
  validation. Do not silently drop an ecosystem because it differs from the selected
  platform emphasis. For every material ecosystem, research the current capability
  and integration path from official sources when browsing is available.

  The selected platform is an evaluation emphasis, not an exclusive architecture.
  Preserve every relevant detected ecosystem. A productivity-suite signal does not
  prove a primary cloud. A DNS verification record does not prove broad AI adoption.
  If multiple ecosystems appear, evaluate how they can coexist and where
  interoperability, portability, governance, and commercial leverage matter.

hard_requirements: |
  REQUIRED NARRATIVE ORDER
  1. Executive decisions and the business context
  2. Business value pools and industry art of the possible
  3. Evidence basis and likely current state
  4. Complete opportunity inventory, then the prioritized portfolio and explicit choices
  5. Business case, unit economics, operating model, and adoption
  6. Architecture and workload placement
  7. Governance, risk, roadmap, and board actions

  REQUIRED BUSINESS-VALUE LENS
  - Identify the company's economic engine, strategic tensions, distinctive strengths,
    and the two or three value pools that matter most.
  - Separate revenue, margin, product/service, experience, workforce, resilience, and
    risk value. Do not collapse all value into labor savings.
  - Explain what must remain human-led or relationship-led because it is central to
    trust, accountability, safety, or differentiation.
  - Trace each recommended investment through this chain: strategic objective,
    value mechanism, affected business unit, capability change, measurable outcome,
    investment choice, and evidence gate.
  - Distinguish defending the core business, improving the current operating model,
    extending products or services, and creating a credible new business model.
  - Frame the portfolio as capital allocation with opportunity cost. State why this
    use of management attention, operating expense, or capital is preferable to the
    strongest non-AI alternative.

  REQUIRED INDUSTRY ART OF THE POSSIBLE
  - Research what leading organizations, adjacent industries, customers, suppliers,
    and credible new entrants are doing now.
  - Separate proven patterns, emerging patterns, frontier possibilities, and hype.
  - Explain which capabilities are becoming table stakes and which could create
    company-specific advantage. Cite current primary or official sources.
  - Distinguish reported tool adoption, production deployment, realized operating
    value, and durable advantage. Do not treat a broad adoption survey or vendor case
    study as proof of company-specific economics.

  REQUIRED OPPORTUNITY INVENTORY AND PRIORITIZED PORTFOLIO
  Produce two distinct, clearly separated outputs.
  - COMPLETE OPPORTUNITY INVENTORY: generate a broad inventory of credible,
    company-specific AI opportunities and preserve every sufficiently grounded idea,
    including ideas that are lower priority, longer term, dependent on missing
    capabilities, or not yet supported by enough evidence. Do not discard an idea
    merely because it is not a current priority. Organize by business outcome,
    workflow, product, service, customer, and workforce. Keep each entry compact.
  - PRIORITIZED PORTFOLIO: select the ideas most relevant for leadership attention
    now. Explain why each was prioritized, why other credible ideas were deferred,
    and what evidence could change the prioritization. Produce full initiative
    decision cards only for prioritized ideas.
  - Preserve ideas built from weak but potentially important signals as emerging
    opportunities or longer-term options. State the uncertainty and what must be
    learned before they could be prioritized. Do not delete a potentially valuable
    idea solely because its evidence is incomplete.
  - Separate the complete inventory from the prioritized portfolio so leaders can
    see everything considered and everything deferred, not only the current picks.

  REQUIRED IDEA CONNECTION
  Every idea, in the inventory or the portfolio, must identify:
  - The company-specific business anchor it attaches to
  - The affected workflow, product, service, customer, or workforce group
  - The business outcome it may influence
  - Why AI may be useful, and why a conventional process, software, analytics, or
    automation approach may be better
  - Supporting evidence and its strength
  - Dependencies, unknowns, and questions to validate
  Provide compact summaries for inventory entries. Do not manufacture baselines,
  cost models, targets, owners, or implementation plans simply to fill an inventory
  field; reserve detailed decision cards for the prioritized portfolio.

  REQUIRED PORTFOLIO HIERARCHY
  Classify every idea as exactly one of: foundational capability, near-term
  practical opportunity, strategic expansion opportunity, differentiated product or
  service opportunity, longer-term option, monitor, or defer pending evidence.

  REQUIRED NEWS-DRIVEN IDEATION
  Treat industry research as an idea generator, not a news summary.
  - Research current AI developments using recent primary and official sources,
    preferring the last 30-90 days when materially relevant.
  - Verify current product names, capabilities, availability, limitations, and
    maturity before using them.
  - Translate each material development into one or more possible implications for
    this company, naming the workflows, products, services, customers, employees,
    or risks it could affect.
  - Generate additional candidate ideas when a development makes a use case newly
    practical, safer, less expensive, easier to deploy, or more strategically
    important. Ignore developments that do not materially change the range of
    credible opportunities for this company.
  - For every idea materially influenced by a recent development, label the
    underlying pattern as exactly one of: proven operating pattern, scaling pattern,
    emerging opportunity, frontier possibility, or primarily vendor-led or unproven
    claim. Do not present an emerging or frontier capability as a proven production
    pattern.

  REQUIRED INITIATIVE DECISION CARD
  Every prioritized initiative must state:
  - Strategic objective, value mechanism, and why the initiative matters now
  - Business outcome and accountable executive owner
  - Affected customer, employee, partner, product, or operational journey
  - Evidence and assumptions, including what is still unknown
  - Baseline and target business metric, expressed as a range when estimated
  - Current-stack fit and required data, process, integration, and change dependencies
  - Primary architecture option and at least one credible alternative
  - Build, buy, partner, or combine rationale
  - Opportunity cost and strongest conventional or non-AI alternative
  - Fully loaded cost and business unit economics, not only model or token cost
  - 30-day discovery action, 90-day test, decision gate, and sequencing dependency
  - Success KPI, leading indicator, risk control, kill criterion, and revisit trigger

  REQUIRED WORKLOAD-PLACEMENT ANALYSIS
  Evaluate only material options, but consider the full decision space: embedded SaaS,
  managed public-cloud AI, multiple public clouds, private or on-premises accelerated
  infrastructure, edge or disconnected deployment, and hybrid combinations. Compare:
  - Data residency, sovereignty, privacy, intellectual property, and regulatory needs
  - Latency, connectivity, offline operation, safety, and survivability
  - Sustained throughput, utilization, capacity, model size, and accelerator demand
  - Integration with the observed identity, data, security, application, and operations stack
  - Model choice, portability, observability, evaluation, and exit options
  - Skills, operating burden, support, time to value, commercial terms, and fully loaded TCO
  - Demand shape, burstiness, queue tolerance, expected useful life, break-even
    utilization, power, cooling, facilities, networking, storage, and refresh risk

  Do not prescribe a data center or accelerator purchase merely because it is possible.
  Private, on-premises, or edge processing earns a recommendation only when workload
  scale, utilization, latency, sovereignty, safety, resilience, or control justifies
  the capital and operating burden. Likewise, do not assume public cloud is always
  cheaper or strategically superior. Evaluate a portfolio of workload placements
  rather than forcing one answer across every use case. State the workload measurements,
  capacity assumptions, and break-even evidence needed to decide.

  REQUIRED GOVERNANCE AND ECONOMICS
  - Tie governance depth to use-case consequences, autonomy, affected people, and the
    full AI lifecycle. Include testing, human accountability, incident response,
    monitoring, change control, decommissioning, and third-party risk.
  - Use business unit metrics such as cost per case, decision, transaction, product,
    customer outcome, or service delivered. Connect technical costs to value.
  - Include people, process redesign, data work, integration, security, evaluation,
    change management, vendor commitments, cloud, SaaS, data-center, and support costs.

  REQUIRED EVIDENCE DISCIPLINE
  - Use compact [cite: N] references for material factual claims and recommendations.
  - End with one ## Sources section containing the cited URLs.
  - Verify current vendor and service names against official documentation. Mark
    preview, regional, or unconfirmed capabilities accurately.
  - Verification is an outcome, not an instruction. If current official evidence is
    not present and this run cannot browse, do not assert a current product name,
    feature, price, availability, or lifecycle state. State the capability requirement,
    evidence gap, and exact validation action instead.
  - Never invent internal baselines, dollar values, adoption rates, product usage,
    competitor deployments, customer-specific ROI, savings, revenue, budgets,
    staffing, timelines, adoption levels, data quality, technical readiness, or
    ownership. When a baseline is unknown, name the metric that must be established.
    When value is uncertain, describe the value mechanism and expected direction of
    change rather than fabricating a percentage or dollar amount. When ownership is
    unknown, identify the likely accountable function and label it "Owner to confirm."
  - Clearly distinguish confirmed evidence, reported information, inference,
    hypothesis, and unknown. Do not let one uncertain item silently become a
    factual premise for another.

writing_standards: |
  Write for executives who need to make tradeoffs. Lead each section with the decision
  or implication, then show the evidence and reasoning. Use plain language before
  technical detail. Be ambitious about possibilities and conservative about claims.

  Prefer a small, ranked portfolio over a long use-case catalog. Explain why an item
  won, why another lost, what it enables later, and what would change the ranking.
  Name alternatives and tradeoffs without repeating empty caveats.

  Use tables when they clarify value pools, evidence, portfolio ranking, workload
  placement, economics, sequencing, ownership, or risk. Keep prose readable in
  Markdown, plain text, DOCX, and PDF. Do not rely on color alone.

  Avoid inflated urgency, generic inevitability, precise unsupported returns, and
  stale vendor-event references. Do not use manipulative sales language. Do not make
  a person look like the author of work they did not author.

epistemic_rules:
  framework_constraints: |
    Follow only the sections defined in this AI Strategy contract. Do not add SWOT,
    Porter's Five Forces, value-chain, or other frameworks unless a section explicitly
    requests them and they improve a named executive decision.
  audience_consistency: |
    Write for the CEO, CIO, board, executive leadership, and accountable business
    owners. The document is transparent decision support that can be shared with the
    company. It is not internal sales preparation, a consulting pitch, or junior analysis.
  engagement_realism: |
    For each initiative, identify the accountable outcome owner, funding source if known,
    decision dependencies, adoption burden, credible internal and external alternatives,
    and evidence required to release more investment. Never invent a budget or decision
    timeline. Do not assume a consulting engagement, favored supplier, or sales motion.
  confidence_labeling: |
    Label material company claims as Confirmed, Reported, Estimated, or Hypothesis.
    Label recommendations as Low-regret pattern, Context-dependent bet, or Frontier
    option. Keep an observation separate from the inference drawn from it.
  avoid_compounded_inference: |
    Do not turn one hypothesis into the factual premise of another. If an upstream
    company fact is uncertain, carry that uncertainty into the recommendation and
    make validation a decision gate.
  numeric_precision: |
    Use ranges with explicit assumptions. If the baseline is unknown, provide a
    calculation model and the inputs leadership must obtain. Do not fabricate a
    company-specific ROI from an industry benchmark.
  scenario_comparison: |
    Replace statements of inevitability with scenario comparisons. Include an
    option to defer or use conventional technology when that is credible.
  source_honesty: |
    DNS, hiring, and public web signals have bounded meanings. State what each signal
    supports and what it cannot establish without internal validation.
  idea_preservation: |
    Preserve the complete inventory of credible company-specific ideas. Do not delete
    a potentially valuable idea because it is lower priority, longer term, dependent on
    missing capabilities, or supported only by weak evidence. Retain it as an emerging
    opportunity or longer-term option, state the uncertainty, and name what must be
    learned before it could be prioritized.
  maturity_honesty: |
    For any idea shaped by a recent AI development, label the underlying pattern as
    proven operating pattern, scaling pattern, emerging opportunity, frontier
    possibility, or primarily vendor-led or unproven claim. Never present an emerging
    or frontier capability as a proven production pattern.

formatting:
  paragraphs: "Use concise paragraphs for reasoning and implications"
  bullets: "Use bullets for decisions, requirements, and bounded lists"
  tone: "Direct, evidence-grounded, and suitable for CEO, CIO, and board review"
  citations: "Use compact inline references and one final Sources appendix"
  tables: "Use accessible tables with explicit headers and units"

heuristics:
  business_first: |
    If a recommendation starts with a product name, rewrite it to start with the
    business outcome, accountable owner, and decision to be made.
  portfolio_not_catalog: |
    Keep the prioritized portfolio short: rank a few initiatives across value,
    evidence, feasibility, risk, adoption load, and option value. A longer prioritized
    list is not a deeper strategy. This restraint applies to the prioritized portfolio,
    not to the complete opportunity inventory, which stays broad but compact.
  complementary_assets: |
    Treat data, process design, skills, incentives, governance, integration, and
    operating ownership as part of the investment rather than implementation detail.
  unit_economics: |
    Move from cost per token or call toward cost and value per business outcome.
  workload_fit: |
    Select deployment location from workload requirements and economics, not from
    vendor preference or a universal cloud-versus-data-center rule.

# Vendor research is resolved dynamically so shipped prompts do not pin dated
# conference notes or stale product catalogs.
data_sources: []

sections:
  - id: executive_summary
    name: "Executive Decision Brief (Executive Summary)"
    part: 1
    purpose: "Give leaders the decision, value logic, uncertainty, and next move on one page"
    covers:
      - "Company-specific business context and the two or three value pools that matter most"
      - "Recommended portfolio, investment posture, and what is deliberately deferred"
      - "Top board and executive decisions, owners, and next 30-day actions"
      - "Largest assumptions, risks, and evidence that could change the recommendation"
    depth: "Approximately 500-700 words. Write this last so it reflects the analysis."

  - id: strategic_thesis
    name: "Business Strategy and AI Strategic Thesis"
    part: 2
    purpose: "Derive the role of AI from the company's economic engine and strategy"
    subsections:
      - id: enterprise_performance_agenda
        name: "Enterprise Performance Agenda"
        covers:
          - "Profitable growth, margin and productivity, product and service strength, experience, resilience, and risk priorities"
          - "Strategic tensions that require a choice rather than a generic technology program"
          - "CEO, CIO, finance, business-owner, and board decision lenses"
      - id: economic_engine
        name: "Economic Engine and Strategic Tensions"
        covers:
          - "How the company creates, delivers, and captures value"
          - "Growth, margin, customer, product, workforce, and risk tensions"
          - "Distinctive capabilities and relationships that should be amplified or protected"
      - id: value_pool_thesis
        name: "Value Pool Thesis"
        covers:
          - "Ranked value pools with business rationale"
          - "Where AI may matter and where conventional change is likely better"
          - "What should remain human-led and why"
      - id: strategic_options
        name: "Strategic Posture Options"
        covers:
          - "Pragmatic adopter, capability builder, and business-model innovator options"
          - "Risk, capital, time-to-value, and option-value tradeoffs"
          - "Recommended posture, opportunity cost, and conditions under which another option wins"
    depth: "Business language only until the strategic posture is clear. Do not name vendors here."

  - id: competitive_landscape
    name: "Industry Direction and Art of the Possible"
    part: 3
    purpose: "Show what is changing in the industry before selecting technologies"
    subsections:
      - id: adoption_baseline
        name: "Industry Adoption and Operating Patterns"
        covers:
          - "Current adoption by industry, firm size, and business function where evidence exists"
          - "Proven patterns, emerging patterns, frontier options, and common failure modes"
          - "Complementary capabilities associated with productive adoption"
      - id: ecosystem_moves
        name: "Competitor, Customer, Supplier, and Adjacent-Market Moves"
        covers:
          - "Specific sourced examples and their strategic implications"
          - "Table-stakes capabilities versus possible differentiators"
          - "New entrants, substitutes, and business-model pressure"
      - id: scenarios
        name: "Three Plausible Industry Scenarios"
        covers:
          - "Measured evolution, accelerated adoption, and disruption scenarios"
          - "Leading indicators and implications for the company's timing"
    depth: |
      Use current primary, official, or first-party sources, preferring developments
      from the last 30-90 days when materially relevant. Do not infer a competitor
      deployment without evidence. Translate each material development into
      company-specific implications and candidate ideas rather than summarizing news,
      and label the underlying pattern maturity (proven, scaling, emerging, frontier,
      or primarily vendor-led/unproven). Feed the resulting ideas into the Complete
      Opportunity Inventory in Part 5.

  - id: current_state
    name: "Evidence Basis and Likely Current State"
    part: 4
    purpose: "Separate observed facts, bounded signals, hypotheses, contradictions, and unknowns"
    subsections:
      - id: evidence_ledger
        name: "Evidence and Assumption Ledger"
        covers:
          - "Source type, observation, confidence, implication, limitation, and validation question"
          - "Contradictions and material evidence gaps"
      - id: business_readiness
        name: "Business and Operating Readiness"
        covers:
          - "Leadership ownership, process clarity, baseline metrics, adoption capacity, and change load"
          - "Advertised skills and hiring direction without treating job postings as deployed capability"
      - id: complete_stack
        name: "Observed Technology and Service Stack"
        covers:
          - "Productivity, identity, security, cloud, hosting, data, AI providers, enterprise apps, integration, developer tooling, content, data center, and edge"
          - "Observed signal versus inferred use, with confidence and validation need"
          - "Platform coexistence, portability, gaps, and likely integration boundaries"
          - "Technology-signal disposition ledger proving that every relevant observed ecosystem was considered"
      - id: readiness_constraints
        name: "Constraints and Prerequisites"
        covers:
          - "Data rights and quality, process ownership, integration, security, skills, procurement, and governance"
    depth: "Do not score maturity from a service list alone. Unknown is a valid result."

  - id: opportunity_domains
    name: "Complete Opportunity Inventory"
    part: 5
    purpose: "Generate and preserve every credible company-specific opportunity, organized by value pool rather than technology category, before any prioritization"
    subsections:
      - id: growth_value
        name: "Growth, Retention, Pricing, and Market Expansion"
        covers:
          - "Revenue, conversion, retention, cross-sell, pricing, and channel opportunities"
      - id: margin_value
        name: "Margin, Throughput, Quality, and Working Capital"
        covers:
          - "Cost to serve, cycle time, capacity, defects, rework, forecasting, and asset utilization"
      - id: product_value
        name: "Products, Services, and Business Models"
        covers:
          - "Defend and improve existing offerings, AI-enabled services, credible new products, and monetization"
          - "Changes to the customer promise, delivery model, pricing, or basis of competition"
      - id: experience_value
        name: "Customer, Partner, and Employee Experience"
        covers:
          - "Moments where faster, more relevant, or more consistent decisions change outcomes"
      - id: resilience_value
        name: "Risk, Safety, Compliance, and Resilience"
        covers:
          - "Error reduction, fraud, compliance, security, continuity, key-person risk, and decision quality"
    depth: |
      Generate a broad inventory and preserve every sufficiently grounded idea,
      including lower-priority, longer-term, capability-dependent, and weakly-evidenced
      ideas. Do not discard ideas here; selection happens in Part 6. Keep each entry
      compact and connected to the company (anchor, affected workflow/product/service/
      customer/workforce, outcome, why AI, why a conventional approach may be better,
      evidence strength, dependencies, unknowns, validation questions). Tag each idea
      with its portfolio-hierarchy class and, when news-driven, its pattern maturity.
      Do not manufacture baselines or business cases to fill inventory fields.

  - id: prioritization_filters
    name: "Prioritized Portfolio and Explicit Choices"
    part: 6
    purpose: "Prioritize the complete inventory transparently, only after every credible idea has been shown"
    covers:
      - "Strategic relevance and company-specific fit"
      - "Business value mechanism and differentiation potential"
      - "Evidence strength and feasibility"
      - "Data and process readiness"
      - "Adoption complexity and accountable ownership"
      - "Risk, autonomy, affected people, and regulatory exposure"
      - "Fully loaded unit economics and commercial flexibility"
      - "Dependency on other capabilities, opportunity cost, and portfolio balance"
    depth: |
      Prioritize only after Part 5's complete inventory is on the page. Show the
      reasoned ranking and its sensitivity to uncertain assumptions, and explain the
      ranking in plain language. Do not use false numerical precision when the
      underlying evidence is qualitative. State why each prioritized idea won, why
      other credible ideas were deferred, and what evidence would change the ranking.
      Assign each idea its portfolio-hierarchy class. Include an explicit What NOT to
      Pursue Now table with rationale, revisit trigger, and signal to watch;
      "deferred" means retained and watched, not deleted.

  - id: quick_wins
    name: "Initiative Decision Cards: Quick Wins and Bigger Bets"
    part: 7
    purpose: "Turn the ranked portfolio into falsifiable, owned decisions"
    subsections:
      - id: quick_win_cards
        name: "Three to Five Quick Wins"
        covers:
          - "Low-regret tests that can begin within 90 days"
          - "Complete initiative decision card for each"
      - id: bigger_bets
        name: "Two to Four Bigger Bets"
        covers:
          - "Transformational options that require capability, data, operating-model, or product investment"
          - "Complete initiative decision card for each"
      - id: conventional_alternatives
        name: "Where AI Is Not the Best First Move"
        covers:
          - "Process, policy, analytics, integration, or conventional automation alternatives"
          - "Conditions that would justify revisiting AI"
    depth: "Apply every field in the required initiative decision card. Do not invent baselines or returns."

  - id: roi_models
    name: "Business Case, Unit Economics, and ROI"
    part: 8
    purpose: "Connect technology and transformation cost to business outcomes"
    subsections:
      - id: value_models
        name: "Value Models"
        covers:
          - "Revenue, margin, product, experience, workforce, risk, and resilience value"
          - "Baseline, formula, range, assumptions, confidence, and attribution limits"
      - id: fully_loaded_cost
        name: "Fully Loaded Cost and Capacity"
        covers:
          - "People, process, data, integration, security, evaluation, change, vendor, cloud, SaaS, data-center, edge, and support cost"
          - "Capacity, utilization, commitment, demand shape, power, facilities, networking, refresh, and scaling assumptions"
      - id: unit_economics
        name: "Business Unit Economics"
        covers:
          - "Cost and value per case, decision, transaction, customer outcome, product, or service"
          - "Leading indicators, breakeven conditions, and time to value"
      - id: funding_options
        name: "Investment Scenarios"
        covers:
          - "Minimum viable learning, balanced portfolio, and accelerated option"
          - "Capital, operating cost, management capacity, opportunity cost, risk, and option-value tradeoffs"
    depth: "Use formulas instead of fabricated company numbers when internal inputs are missing."

  - id: organizational_model
    name: "Operating Model, Ownership, and Adoption"
    part: 9
    purpose: "Make business ownership and durable capability explicit"
    covers:
      - "Executive sponsor, business outcome owner, product owner, technology owner, data owner, risk owner, and frontline participation"
      - "Federated versus centralized responsibilities based on current organization and portfolio"
      - "Build, buy, partner, and capability-transfer choices"
      - "Workflow redesign, incentives, training, support, and adoption measurement"
      - "Experiment intake, reusable platform capabilities, funding, and retirement"
    depth: "Do not prescribe a new executive title without evidence that authority or accountability is missing."

  - id: architecture_posture
    name: "Architecture and Workload Placement"
    part: 10
    purpose: "Translate earned business choices into an interoperable technical posture"
    subsections:
      - id: architecture_principles
        name: "Architecture Principles"
        covers:
          - "Identity, authorization, data boundaries, audit, observability, evaluation, and human accountability"
          - "Model choice and routing, portability, open interfaces, and exit options"
          - "Reuse versus initiative-specific components"
      - id: stack_fit
        name: "Current-Stack Fit and Integration"
        covers:
          - "How every relevant observed ecosystem affects the target posture"
          - "Contradictions, missing capabilities, integration boundaries, and migration avoidance"
          - "Identity, data, security, model, application, observability, and commercial control points across ecosystems"
          - "Disposition for every observed technology signal: use, integrate, contain, replace, defer, immaterial, or validate"
      - id: placement_matrix
        name: "Workload Placement Decision Matrix"
        covers:
          - "Embedded SaaS, managed public cloud, multicloud, private/on-premises accelerated, edge/disconnected, and hybrid options"
          - "Data, latency, safety, sovereignty, demand shape, utilization, capacity, skills, operating burden, TCO, and time-to-value criteria"
          - "Break-even utilization, power, cooling, networking, storage, support, useful life, and refresh assumptions for dedicated accelerated capacity"
          - "Primary recommendation, credible alternative, measurements required, and exit path"
      - id: autonomy_boundaries
        name: "Automation and Autonomy Boundaries"
        covers:
          - "Read, recommend, draft, transact, and autonomous action levels"
          - "Human approval, confidence, value, safety, and legal thresholds"
          - "Identity, least privilege, audit, rollback, rate limits, and kill controls"
    depth: "Technical detail follows the business portfolio. Prefer workload-by-workload placement. Evaluate hybrid and accelerated processing whenever material, but recommend dedicated capacity only when its evidence and economics win."

  - id: risk_analysis
    name: "Governance, Risk, and Trust"
    part: 11
    purpose: "Scale controls with consequences and lifecycle risk"
    covers:
      - "Use-case inventory, impact classification, accountable approval, and accepted residual risk"
      - "Data and IP rights, privacy, security, bias, accuracy, misuse, safety, model and vendor risk"
      - "Pre-deployment testing, evaluation thresholds, red teaming where warranted, and release evidence"
      - "Production monitoring, human escalation, incident response, change control, and decommissioning"
      - "Third-party, open-model, supply-chain, regulatory, and contractual risk"
      - "Risk containment value and the cost of control"
    depth: "Align controls with current authoritative frameworks and the company's jurisdiction and risk tolerance."

  - id: compounding_logic
    name: "Roadmap, Dependencies, and Learning Gates"
    part: 12
    purpose: "Sequence value, capability, and evidence without creating a pilot graveyard"
    covers:
      - "0-30 day decision and measurement work"
      - "31-90 day tests with owners, baselines, and kill criteria"
      - "3-12 month capability and portfolio sequence"
      - "12-36 month options that remain contingent on evidence"
      - "Data, trust, integration, skill, and platform dependencies"
      - "Scale, pause, stop, and revisit gates"
    depth: "Show how early work creates reusable assets or evidence for later bets. Retire initiatives that do neither."

  - id: board_summary
    name: "Board Decision Summary"
    part: 13
    purpose: "Make the required decisions and accountability unmistakable"
    covers:
      - "Five or fewer decisions with recommended option and credible alternative"
      - "Value at stake, investment range or required inputs, and confidence"
      - "Capital allocation, opportunity cost, and management-capacity implications"
      - "Owner, decision date, dependency, risk acceptance, and next evidence gate"
      - "What leadership is choosing not to fund now"
      - "Questions the board should ask management"
    depth: "One decision table plus concise interpretation. Do not repeat the executive brief."

  - id: decision_enablement
    name: "Transparent Decision Enablement Toolkit"
    part: 14
    purpose: "Help stakeholders challenge, improve, and own the decisions openly"
    subsections:
      - id: evidence_review
        name: "Evidence and Assumption Review"
        covers:
          - "Most consequential assumptions, supporting evidence, dissenting evidence, and validation owner"
      - id: decision_questions
        name: "Executive and Technical Decision Questions"
        covers:
          - "Questions that expose goals, constraints, tradeoffs, readiness, risk tolerance, and alternatives"
      - id: stakeholder_accountability
        name: "Stakeholder Accountability Map"
        covers:
          - "Decision rights, outcome ownership, affected groups, reviewers, operators, and escalation"
      - id: workshop_design
        name: "Decision Workshop Agenda"
        covers:
          - "Shared evidence, value-pool ranking, option comparison, risk review, decision, and follow-up"
          - "Selection criteria disclosed before scoring"
          - "Recorded dissent, unresolved questions, and owners"
      - id: decision_memo
        name: "Decision Memo Template"
        covers:
          - "Problem, evidence, options, recommendation, economics, risk, owner, decision, and review date"
          - "Accurate authorship and contribution record"
    depth: "Facilitate informed consent and constructive challenge. Do not use covert persuasion or favored scoring criteria."

  - id: next_steps
    name: "Next 30 Days"
    part: 15
    purpose: "Close with bounded actions that improve the next decision"
    covers:
      - "Actions, accountable owners, target dates, dependencies, and expected evidence"
      - "Data and baseline requests"
      - "Architecture or vendor questions to validate only after business priorities are agreed"
      - "Decision calendar and review cadence"
    depth: "Every action must produce evidence, reduce risk, or enable a named decision."

vendor_guidance:
  azure:
    display_name: "Microsoft ecosystem emphasis"
    guidance: |
      Treat Microsoft as an evaluation emphasis, not an exclusive answer. Verify current
      official names and capabilities for productivity, agents and model access, data and
      analytics, identity, security, governance, integration, operations, hybrid control,
      and edge. Preserve detected non-Microsoft AI, data, cloud, and enterprise platforms.
      Compare at least one credible alternative for every material architecture decision.
    comparison_areas:
      - "Business fit and integration with the observed productivity, identity, data, security, and application stack"
      - "Model and agent choice, portability, evaluation, governance, and commercial terms"
      - "Public cloud, multicloud, hybrid, private, and edge workload placement when material"
      - "Fully loaded unit economics, operating burden, and exit options"
    research_sources: "current official Microsoft documentation, release notes, pricing, architecture guidance, and compliance materials"

  aws:
    display_name: "AWS ecosystem emphasis"
    guidance: |
      Treat AWS as an evaluation emphasis, not an exclusive answer. Verify current official
      names and capabilities for models, agents, data, analytics, security, governance,
      integration, operations, hybrid, and edge. Preserve detected productivity suites,
      non-AWS AI providers, data platforms, and other clouds. Compare at least one credible
      alternative for every material architecture decision.
    comparison_areas:
      - "Business fit and integration with the observed identity, data, security, application, and productivity stack"
      - "Model and agent choice, portability, evaluation, governance, and commercial terms"
      - "Public cloud, multicloud, hybrid, private, and edge workload placement when material"
      - "Fully loaded unit economics, operating burden, and exit options"
    research_sources: "current official AWS documentation, release notes, pricing, architecture guidance, and compliance materials"

  gcp:
    display_name: "Google ecosystem emphasis"
    guidance: |
      Treat Google as an evaluation emphasis, not an exclusive answer. Verify current
      official names and capabilities for productivity, models, agents, data, analytics,
      security, governance, distributed cloud, and edge. Preserve detected non-Google AI,
      data, cloud, and enterprise platforms. Compare at least one credible alternative for
      every material architecture decision.
    comparison_areas:
      - "Business fit and integration with the observed productivity, identity, data, security, and application stack"
      - "Model and agent choice, portability, evaluation, governance, and commercial terms"
      - "Public cloud, multicloud, hybrid, private, and edge workload placement when material"
      - "Fully loaded unit economics, operating burden, and exit options"
    research_sources: "current official Google Cloud documentation, release notes, pricing, architecture guidance, and compliance materials"

  private:
    display_name: "Private, on-premises, edge, and accelerated infrastructure emphasis"
    guidance: |
      Evaluate private or accelerated infrastructure as a workload-placement option, not a
      predetermined purchase. Compare current NVIDIA and credible alternative hardware,
      software, open-model, orchestration, and operations ecosystems. Require evidence for
      sustained utilization, latency, disconnected operation, sovereignty, safety,
      resilience, model control, or TCO before recommending capital investment. Include a
      managed-cloud alternative, hybrid operating model, demand profile, break-even
      utilization, capacity plan, facilities and power assumptions, support model, useful
      life, refresh risk, and exit path.
    comparison_areas:
      - "Accelerator demand, throughput, utilization, capacity, power, facilities, networking, and storage"
      - "Open and proprietary models, inference and training stacks, portability, and support"
      - "Cloud burst, hybrid control plane, edge/disconnected operation, and data movement"
      - "Capital and operating cost, skills, reliability, security, governance, and refresh risk"
    research_sources: "current official accelerator-vendor, server-partner, open-source project, and platform documentation"

  agnostic:
    display_name: "Vendor-neutral, multicloud, hybrid, and private evaluation"
    guidance: |
      Start from the complete observed stack and business portfolio. Compare embedded SaaS,
      model providers, public clouds, data platforms, private accelerated infrastructure,
      edge, open-source components, and hybrid combinations only where they are material.
      Do not force a single strategic vendor. Recommend the simplest credible primary
      posture, at least one alternative, interoperability boundaries, commercial leverage,
      and an exit path. Account explicitly for every relevant detected ecosystem, including
      productivity, identity, cloud, data, model-provider, enterprise-application, and
      private-infrastructure signals. Verify all named services against current official
      sources.
    comparison_areas:
      - "Productivity and collaboration AI across the detected work environment"
      - "Model, agent, data, integration, identity, security, governance, and observability layers"
      - "Embedded SaaS, managed public cloud, multicloud, private/on-premises accelerated, edge, and hybrid placement"
      - "Open-source and commercial options, portability, lock-in, resilience, and exit costs"
      - "Business unit economics, fully loaded TCO, time to value, skills, and operating burden"
      - "Workload-by-workload placement, demand shape, break-even utilization, and capital flexibility"

