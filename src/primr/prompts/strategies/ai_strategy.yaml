    required: false

# =============================================================================
# EPISTEMIC RULES (Strategy-Specific Overrides)
# =============================================================================

epistemic_rules:
  confidence_labeling: |
    REQUIRED: Label every significant claim and recommendation:
    
    For FACTS about the company:
    - **Confirmed**: From the strategic report with citations
    - **Reported**: From credible sources but not verified
    - **Estimated**: Calculated or inferred
    - **Hypothesis**: Our interpretation to validate
    
    For AI RECOMMENDATIONS:
    - "Low-regret / proven pattern" - widely adopted, strong evidence base
    - "Context-dependent bet" - success depends on company-specific factors
    - "Exploratory / frontier" - emerging capability, higher uncertainty
    
    Example: "Given their 45,000+ client base (Confirmed - company website), 
    an AI-powered support assistant could reduce ticket volume by 20-40% 
    (Context-dependent bet - depends on current support maturity)"
  transformation_rule: |
    If a sentence implies inevitability, failure, or "only viable path", rewrite it as a scenario comparison.
    Example: Instead of "Companies that don't adopt AI will fail", write "Organizations that move early 
    may gain compounding advantages, while delayed adoption increases the cost of catching up."
  hypothesis_framing: |
    Frame assessments of current state as hypotheses to validate, not facts.
    Use language like "Based on [evidence], we hypothesize..."
  avoid_overreach: |
    The strategic report you're building on is itself a hypothesis document.
    Don't compound speculation on speculation:
    - If the report says "estimated revenue of $1B" don't calculate precise ROI from it
    - If the report hypothesizes about internal priorities, don't build recommendations assuming it's true
    - Use ranges for ROI projections, not point estimates
    - Acknowledge when recommendations depend on unverified assumptions
  numeric_precision: |
    For ROI and investment figures:
    - Use ranges: "$2-4M investment" not "$3.2M"
    - State assumptions explicitly: "Assuming 20% adoption in Year 1..."
    - Acknowledge uncertainty: "ROI of 2-4× over 18-24 months, depending on..."
    - For risk-averse organizations: emphasize risk avoidance alongside upside

formatting:
  paragraphs: "Write in full paragraphs for strategic sections"
  bullets: "Use bullets only for specific recommendations or lists"
  tone: "Strategic and direct, like a CIO presenting to the board"
  citations: "Cite sources per the Research and Validation Protocol"
  tables: "Include ROI tables, comparison matrices, timeline tables"

heuristics:
  ten_twenty_seventy: |
    The "10-20-70 Rule": Allocate roughly 10% effort to algorithms, 20% to technology
    infrastructure, and 70% to people, processes, and cultural transformation.
    Most AI projects fail due to change management, not technology.
  j_curve: |
    The "J-Curve": Expect productivity to dip during the learning phase before surging.
    Leadership must be prepared for a 2-4 month adjustment period.
  rag_default: |
    Default to RAG over fine-tuning for 90% of enterprise use cases. Fine-tune only when
    you need to change the model's style, format, or domain-specific reasoning.

research_validation_protocol: |
  For every vendor service, tool, or capability named in this document:
  1. Verify current name: Confirm the service still exists and has not been renamed or deprecated
  2. Status: Note if GA (Generally Available) or Preview/Beta
  3. Region availability: Flag if limited to specific regions
  4. Compliance certifications: Note relevant certifications (SOC2, HIPAA, FedRAMP) if applicable
  5. Citation: Link to official product page or release note with date
  6. Pricing: If pricing varies, cite pricing page and state assumptions
  7. Unconfirmed flag: If anything cannot be verified through search, mark as "UNCONFIRMED"


# =============================================================================
# STRATEGIC CONTEXT
# =============================================================================

strategic_context:
  agentic_transformation: |
    We are in the "Agentic Era" where AI evolves from passive assistants to proactive agents
    capable of planning, reasoning, and executing multi-step workflows autonomously. The key
    distinction is between "AI-enabled" (AI bolted onto legacy processes) vs "AI-native"
    (intelligence as the foundational operating substrate). The competitive advantage lies
    not in "using AI" but in "becoming agentic." Not every function needs to become agentic
    immediately. The strategy must distinguish where autonomy creates real economic leverage
    versus where it adds unnecessary risk.

# =============================================================================
# SECTIONS
# =============================================================================

sections:
  # =============================================================================
  # PART A: THE IDEAS (What's Possible - Traditional Strategy Content)
  # =============================================================================
  
  - id: strategic_thesis
    name: "AI Strategic Thesis"
    part: 1
    purpose: "Establish the recommended direction before diving into specifics"
    subsections:
      - id: why_non_optional
        name: "Why AI Becomes Structurally Non-Optional"
        covers:
          - "Scale: Data volumes that exceed human processing capacity"
          - "Complexity: Decision spaces too large for manual analysis"
          - "Speed: Competitive requirements demanding faster response"
          - "Labor constraints: Talent scarcity, cost pressures, skill gaps"
          - "Customer expectations: Rising baseline for personalization"
        depth: |
          Be specific to the company's situation. Reframe AI as structural necessity, not enthusiasm.
          
          Key framing principle: AI should ENABLE what makes this company distinctive, not replace it.
          - For service-oriented companies: "AI lets [Company] remain a [service/relationship/trust] company at scale"
          - For efficiency-focused companies: "AI accelerates [Company]'s cost advantage"
          - For innovation-focused companies: "AI amplifies [Company]'s ability to move fast"
          
          Match the framing to what the company research reveals about their identity and strategy.
      - id: transformation_path
        name: "Recommended Transformation Path"
        covers:
          - "AI-enabled vs AI-native recommendation with rationale"
          - "Proposed primary value lever (cost, revenue, risk, differentiation)"
          - "Recommended priorities with specific reasoning"
          - "Suggested deprioritizations with revisit conditions"
          - "Change management reality (70% of budget to people/process)"
        depth: |
          Avoid generic statements. Be specific to the company's situation.
          Frame Year 1 as "AI hygiene + two competitive necessities" - everything else 
          becomes sequenced optionality. This reduces perceived ambition while maintaining 
          strategic direction.

  - id: executive_summary
    name: "Executive Summary"
    part: 1
    purpose: "The 'so what' for the board"
    covers:
      - "Why AI matters for THIS company specifically"
      - "The recommended investment level and expected ROI"
      - "The 3 most important things to do in the next 12 months"
    depth: "2-3 paragraphs. Concise and actionable."

  - id: current_state
    name: "Likely Current State (Hypotheses to Validate)"
    part: 2
    purpose: "Frame assessments as hypotheses since we lack internal visibility"
    subsections:
      - id: data_platform_maturity
        name: "Data Platform Maturity (Hypothesis)"
        covers:
          - "Likely data sources based on industry"
          - "Probable challenges based on industry patterns"
          - "Signals observed from public information"
      - id: technology_signals
        name: "Technology Signals (What We Can Observe)"
        covers:
          - "Cloud posture signals"
          - "Tech stack hints from job postings"
          - "Digital maturity signals"
      - id: organizational_readiness
        name: "Organizational Readiness (Industry Baseline)"
        covers:
          - "AI adoption curve position"
          - "Change management capacity"
          - "Likely constraints"
      - id: anti_patterns
        name: "Common Anti-Patterns to Discuss"
        covers:
          - "Pilot proliferation"
          - "Tool sprawl"
          - "Data foundation gaps"
    depth: "Frame each assessment as 'Based on [evidence], we hypothesize...'"

  - id: competitive_landscape
    name: "Competitive AI Landscape"
    part: 2
    purpose: "Understand competitive positioning on AI"
    covers:
      - "One competitor ahead on AI: Who, what specifically, what's the directional gap"
      - "One peer making common AI mistakes: What to avoid"
      - "Value at stake over 24 months (best-case, likely-case, delayed-action)"
    depth: |
      Specific examples with evidence, but use directional language for competitive claims:
      - "Materially faster" not "13× faster"
      - "Order-of-magnitude improvement" not precise multiples
      - "Near-real-time for certain segments" not "instant decisioning"
      This protects credibility if someone challenges a figure in a live conversation.

  - id: architecture_posture
    name: "Recommended AI Architecture Posture"
    part: 3
    purpose: "Define what they SHOULD build toward - as reference architecture, not commitment"
    subsections:
      - id: knowledge_grounding
        name: "Knowledge Grounding Pattern (RAG as Default)"
        covers:
          - "RAG as default pattern recommendation"
          - "Vector database and embedding strategy"
          - "When to fine-tune vs RAG"
          - "Data sources to prioritize"
      - id: identity_access
        name: "Identity, Access, and Audit"
        covers:
          - "User authentication to AI systems"
          - "Service principal for AI agents"
          - "Audit logging requirements"
          - "PII handling policies"
      - id: agent_boundaries
        name: "Agent Boundaries and Kill Switches"
        covers:
          - "Autonomy vs human approval boundaries"
          - "Dollar/impact thresholds"
          - "Runaway agent detection"
          - "Escalation paths"
      - id: platform_components
        name: "Reusable Platform Components"
        covers:
          - "Common prompt templates and guardrails"
          - "Shared vector stores and knowledge bases"
          - "Centralized model endpoints"
          - "Evaluation and monitoring infrastructure"
          - "Cost allocation mechanisms"
    depth: |
      Frame as ONE PERSPECTIVE, not the definitive answer:
      - "Here's one way to approach this architecture..."
      - "Tools like [specific service] are one option - there are others with similar capabilities"
      - "This is just our take based on current market research"
      - Always acknowledge alternatives exist and might be better fits
      - The goal is to provide a starting point for their own evaluation, not make the decision for them

  - id: opportunity_domains
    name: "AI Opportunity Domains"
    part: 4
    purpose: "Specific recommendations tailored to the company"
    subsections:
      - id: productivity_ai
        name: "Productivity AI by Persona"
        covers:
          - "3-4 key personas identified"
          - "Specific productivity AI for each persona"
      - id: process_automation
        name: "Process Automation"
        covers:
          - "3-5 high-value automation opportunities"
          - "Specific to company's operations"
      - id: conversational_ai
        name: "Conversational AI"
        covers:
          - "Internal (employee-facing) recommendations"
          - "External (customer-facing) recommendations"
      - id: agentic_ai
        name: "Agentic AI"
        covers:
          - "2-3 agentic AI opportunities"
          - "Connected to data, apps, services"
      - id: generative_bi
        name: "Generative BI and Analytics"
        covers:
          - "Analytics evolution recommendations"
      - id: traditional_ml
        name: "Traditional AI/ML"
        covers:
          - "Forecasting, churn prediction, etc."
      - id: security_governance
        name: "Security, Governance, and Responsible AI"
        covers:
          - "Framework recommendations"
    depth: "Do not give generic advice. Connect every recommendation to their actual business."

  - id: prioritization_filters
    name: "Prioritization Filters"
    part: 5
    purpose: "Framework for evaluating all candidate initiatives"
    covers:
      - "Expected Business Impact"
      - "Data Readiness"
      - "Integration Complexity"
      - "Adoption and Change Load"
      - "Risk and Compliance Exposure"
    depth: "Apply these filters to all recommendations"

  - id: roi_models
    name: "ROI Model Selection"
    part: 5
    purpose: "Use appropriate ROI model for each recommendation type"
    covers:
      - "Productivity ROI (labor savings, throughput)"
      - "Revenue ROI (conversion, retention, pricing)"
      - "Risk ROI (compliance, security, error reduction)"
      - "Risk Containment ROI (avoiding downside, not just generating upside)"
    depth: |
      Include specific calculation frameworks. Present ROI as RANGES with explicit assumptions:
      - "ROI of 2-4× over 18-24 months, assuming..."
      - "Investment of $2-4M depending on scope"
      - "Payback period of 12-18 months if adoption reaches 20%+"
      
      Match ROI framing to company culture (from company research):
      - Risk-averse/conservative companies: ELEVATE RISK CONTAINMENT as first-order benefit
        - Reduced compliance backlog, fewer manual errors, lower key-person dependency
      - Growth-focused companies: Lead with revenue and competitive advantage
      - Efficiency-focused companies: Lead with cost reduction and productivity
      
      The company research should reveal which framing will resonate.

  - id: quick_wins
    name: "Five Quick Wins (Start in 90 Days)"
    part: 5
    purpose: "Immediate, high-confidence opportunities"
    covers:
      - "The Opportunity"
      - "Why It Matters for the company"
      - "Why It Won (prioritization rationale)"
      - "Technology (specific tools with citations, framed as reference architecture)"
      - "Implementation requirements"
      - "ROI Calculation with ranges and explicit assumptions"
      - "Success Metrics"
    depth: |
      Each Quick Win needs comprehensive detail. Frame Year 1 as:
      "AI hygiene + two competitive necessities"
      
      ROI should be presented as ranges:
      - "Expected savings of $500K-$1.2M annually, assuming..."
      - "Productivity improvement of 15-25% for target personas"
      - "Payback in 6-12 months depending on adoption curve"
      
      Technology recommendations should feel optional:
      - "One approach would be [specific tool]..."
      - "Reference architecture could include..."

  - id: compounding_logic
    name: "Compounding Logic Across the AI Portfolio"
    part: 5
    purpose: "Show how early initiatives enable later bets"
    covers:
      - "Data generation dependencies"
      - "Trust-building dependencies"
      - "Infrastructure dependencies"
    depth: "Make dependencies explicit. Show how portfolio builds on itself."

  - id: bigger_bets
    name: "Five Bigger Bets (6-18 Month Horizon)"
    part: 5
    purpose: "Transformational opportunities requiring more investment"
    covers:
      - "Technology architecture"
      - "ROI model"
      - "Risk factors"
      - "Governance tier"
    depth: "Comprehensive details for each bet"

  - id: strategic_choices
    name: "Explicit Strategic Choices (What We Are Choosing NOT to Pursue)"
    part: 5
    purpose: "Frame deprioritizations as deliberate strategic choices - boards love knowing what not to do"
    covers:
      - "What it is"
      - "Why it is tempting"
      - "What focus it enables"
      - "Revisit trigger"
      - "Signal to watch"
    depth: |
      Signals strategic clarity, not avoidance. This section often resonates most strongly 
      with boards because it demonstrates discipline.
      
      Tailor the "do not pursue" list to what the company research reveals:
      - Service/trust-focused companies: Reject fully autonomous customer-facing AI, human-replacing AI
      - Cost-focused companies: Reject expensive custom model training when APIs suffice
      - Speed-focused companies: Reject governance-heavy approaches that slow innovation
      
      Frame as: "We are choosing to preserve [what makes this company distinctive] by NOT pursuing..."

  - id: hypotheses
    name: "What Would Have to Be True (Key Hypotheses)"
    part: 5
    purpose: "Turn recommendations into testable experiments"
    covers:
      - "Conditions for success"
      - "Early signals to monitor"
      - "Disconfirming evidence"
    depth: "Acknowledges uncertainty while providing learning framework"

  - id: organizational_model
    name: "AI Practice Group Structure"
    part: 6
    purpose: "How to organize for sustained AI innovation"
    subsections:
      - id: governance_traffic_light
        name: "Governance Traffic Light System"
        covers:
          - "Green (Low Risk): Internal, non-PII data. Auto-approved."
          - "Yellow (Medium Risk): Customer data, proprietary IP. AI CoE Review."
          - "Red (High Risk): Health/Financial decisions, autonomous agents. Board sign-off."
      - id: operating_model
        name: "Operating Model for Experimentation and Failure"
        covers:
          - "How to handle AI initiative failures"
          - "Learning and iteration framework"
      - id: investment_framework
        name: "Investment Framework"
        covers:
          - "Year 1 Investment Estimate"
          - "ROI Framework"
          - "Build vs. Buy vs. Partner guidance"
    depth: "Practical organizational recommendations"

  - id: risk_analysis
    name: "Risk Analysis"
    part: 7
    purpose: "Comprehensive risk assessment - this section builds trust with risk-aware leadership"
    subsections:
      - id: value_at_stake
        name: "The Value at Stake"
        covers:
          - "Best case scenario (with ranges)"
          - "Likely case scenario (with ranges)"
          - "Delayed action scenario (competitive cost of waiting)"
        depth: "Present as ranges, not deterministic outcomes. Acknowledge uncertainty explicitly."
      - id: risk_containment_benefits
        name: "Risk Containment Benefits"
        covers:
          - "Reduced compliance backlog"
          - "Fewer manual errors and rework"
          - "Lower key-person dependency"
          - "Improved audit trail and governance"
          - "Faster regulatory response capability"
        depth: |
          For risk-averse organizations, this is as compelling as upside.
          Frame AI as reducing operational risk, not just generating returns.
          Tailor emphasis based on what company research reveals about their risk posture.
      - id: technology_risks
        name: "Technology Risks"
        covers:
          - "Vendor lock-in"
          - "Model obsolescence"
          - "Integration complexity"
          - "Data quality dependencies"
      - id: organizational_risks
        name: "Organizational Risks"
        covers:
          - "Change resistance"
          - "Skills gaps"
          - "Competing priorities"
      - id: ai_security_risks
        name: "AI-Specific Security Risks"
        covers:
          - "Jailbreaks"
          - "Hallucinations"
          - "Model drift"
    depth: "Specific risks with mitigation strategies"

  - id: board_summary
    name: "Board Summary (ONE PAGE)"
    part: 8
    purpose: "Executive summary for board presentation"
    covers:
      - "Strategic Thesis (1 paragraph)"
      - "The 5 Most Important Decisions (with investment and ROI)"
      - "Investment Summary (Total Year 1 Ask)"
      - "Expected Year 1 Returns"
      - "What We Are Choosing NOT to Do (3 items)"
      - "Key Risks Acknowledged (Top 3 with mitigation)"
    depth: "MUST fit on ONE PAGE (approximately 500-600 words)"

  - id: next_steps
    name: "Next Steps (Next 30 Days)"
    part: 9
    purpose: "Specific, actionable next steps"
    covers:
      - "Action items with owners"
      - "Target dates"
      - "Dependencies"
    depth: "Concrete and actionable"

  # =============================================================================
  # PART B: THE FACILITATION TOOLKIT (How to Make Them Own It)
  # =============================================================================
  
  - id: facilitation_undeniable_truths
    name: "FACILITATION TOOLKIT: Undeniable Truths"
    part: 10
    purpose: "Axioms that force the client to derive conclusions themselves"
    covers:
      - "For each major recommendation above, provide the 'undeniable truth' that leads to it"
      - "Format: Mathematical/logical fact → Client derives conclusion"
      - "Example: 'At your scale of 45K clients, manual X is mathematically impossible' → They conclude: 'We need automation'"
    depth: |
      Extract 3-5 undeniable truths from the strategy above. These are FACTS that make
      your recommendations the only logical path. Frame as observations, not pitches.

  - id: facilitation_socratic_sequences
    name: "FACILITATION TOOLKIT: Socratic Question Sequences"
    part: 10
    purpose: "Question sequences that lead client to articulate solutions"
    covers:
      - "For top 3 opportunities, provide 4-question sequence"
      - "Situation → Problem → Implication → Need-Payoff"
      - "Client articulates solution, you agree"
    depth: |
      For each major opportunity (Quick Wins, Bigger Bets), provide the question sequence
      that leads them to derive it themselves. They own what they articulate.

  - id: facilitation_pain_amplification
    name: "FACILITATION TOOLKIT: Pain Amplification Points"
    part: 10
    purpose: "Rational data + emotional consequences for key stakeholders"
    covers:
      - "Quantify cost of inaction (Rational Drowning)"
      - "Connect to personal consequences (Emotional Impact)"
      - "Format: 'This costs $X/month AND is why your team works weekends'"
    depth: |
      For each major pain point, provide both the rational cost AND the emotional impact
      on the specific stakeholder. Logic + emotion = decision.

  - id: facilitation_stakeholder_map
    name: "FACILITATION TOOLKIT: Stakeholder Inception Map"
    part: 10
    purpose: "Who to incept and how (Miller Heiman framework)"
    subsections:
      - id: economic_buyer_strategy
        name: "Economic Buyer Strategy"
        covers:
          - "Who likely controls budget (based on company research)"
          - "Inception approach: Financial (ROI as profit protection)"
          - "Key message tailored to this company"
      - id: user_buyer_strategy
        name: "User Buyer Strategy"
        covers:
          - "Who will use the solution daily"
          - "Inception approach: Functional (IKEA Effect in workshops)"
          - "Let them design workflow/interface"
      - id: technical_buyer_strategy
        name: "Technical Buyer Strategy"
        covers:
          - "Who can veto (IT/Legal/Security)"
          - "Inception approach: Rational Drowning (specs/whitepapers)"
          - "Neutralize objections with overwhelming data"
      - id: coach_champion_strategy
        name: "Coach/Champion Strategy (PRIMARY TARGET)"
        covers:
          - "Who is likely internal ally (based on company research)"
          - "Make them the hero - they 'discovered' the solution"
          - "Provide ghostwritten materials (next section)"
    depth: |
      Map the four buying influences for THIS company. The Coach is critical - you sell
      THROUGH them, not TO them. Make them look like a genius.

  - id: facilitation_workshop_design
    name: "FACILITATION TOOLKIT: Workshop Co-Creation Agenda"
    part: 10
    purpose: "The workshop agenda as a covert sales funnel"
    covers:
      - "5-phase agenda: Icebreaker → Pain Mining → Ideation → Selection → Prototyping"
      - "CLIENT HOLDS THE PEN during prototyping (IKEA Effect)"
      - "Facilitation hacks: Parking Lot, Yes Ladder, Reframe Dissent"
      - "The Closing: 'Here is the roadmap YOU designed'"
    depth: |
      Provide the specific workshop agenda for THIS company:
      1. Icebreaker (build safety)
      2. Pain Mining (Rose/Thorn/Bud - make problem undeniable)
      3. Ideation (seed with case studies, use "How Might We" questions)
      4. Selection (criteria that favor your solution)
      5. Prototyping (they draw roadmap, you refine, they hold pen)
      
      Result: Artifact becomes "their roadmap" - rejecting it = rejecting their own work.

  - id: facilitation_champion_enablement
    name: "FACILITATION TOOLKIT: Champion Ghostwriting Templates"
    part: 10
    purpose: "Ready-to-use materials for internal champion"
    subsections:
      - id: inception_email_template
        name: "Inception Email Template"
        covers:
          - "Email for Champion to send to Economic Buyer"
          - "Attributes YOUR strategy to THEM"
          - "Uses company-specific pain points and data"
      - id: business_case_outline
        name: "Trojan Business Case Outline"
        covers:
          - "Executive summary using EXACT workshop phrasing"
          - "Problem statement in their words"
          - "Solution described generically first"
          - "ROI with explicit assumptions"
      - id: roi_calculator_design
        name: "Interactive ROI Calculator Design"
        covers:
          - "Variables they input (yellow cells)"
          - "Formulas that produce 'Cost of Inaction'"
          - "IKEA Effect: They own output because it's 'their numbers'"
    depth: |
      Provide actual templates customized for THIS company:
      
      Email Template:
      Subject: Strategic Opportunity: Addressing the [Specific Pain] Latency
      
      "[Executive Name],
      I've been analyzing our bottlenecks in [Specific Process]. The data suggests 
      we're bleeding [Specific Cost] due to inefficiency.
      
      I've been exploring modern approaches, specifically [Incepted Concept from strategy].
      There's an opportunity to turn this cost center into competitive advantage.
      
      I've sketched a preliminary roadmap (attached). I engaged [Consultancy] to 
      sanity-check my assumptions - their benchmarks confirm [Specific ROI]%.
      
      Can we discuss during budget review?
      [Champion Name]"
      
      Result: Champion looks like genius. You're just "sanity-checking."

