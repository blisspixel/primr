# AI Strategy Prompt Configuration
# This file defines the structure and content requirements for AI strategy reports.
#
# Purpose: Board-level AI roadmap for strategic decision making.
# Goal: Answer "What should we actually do with AI, and why?"
# Audience: CIO, board members, executive leadership.
#
# Dependencies:
#   - shared/epistemic_rules.yaml (epistemic standards)
#   - shared/formatting.yaml (formatting rules)
#   - shared/personas.yaml (ai_strategist persona)

meta:
  name: "AI Strategy Roadmap"
  version: "1.0.0"
  description: "Comprehensive AI strategy for board-level decision making"
  output_format: "markdown"
  output_filename: "{company_name}_AI_Strategy"
  expected_pages: "15-30"

# Override default persona for this strategy
persona: "ai_strategist"

document_purpose: |
  This is an AI strategy document for internal preparation. The goal is to identify the
  BEST opportunities for this company - what they should actually do with AI over the next
  1-3 years to create real business value.
  
  BUT: A great idea does nothing if not adopted. This document must frame recommendations
  in a way that maximizes the probability of ACTION, not just agreement.
  
  ADOPTION PSYCHOLOGY (apply throughout):
  
  1. FRAME AS LOSS AVOIDANCE, NOT JUST GAIN
     - Bad: "AI could increase efficiency by 20%"
     - Good: "Without AI, competitors will move 20% faster - the gap compounds monthly"
     - Loss aversion is 2x stronger than gain motivation
  
  2. ANCHOR TO THEIR EXISTING PRIORITIES
     - Don't introduce new goals. Connect AI to goals they already have.
     - "This AI initiative directly supports your $50M growth target"
     - Makes AI feel like accelerating existing strategy, not a distraction
  
  3. PROVIDE "INGREDIENTS" NOT FINISHED SOLUTIONS
     - Give frameworks, benchmarks, selection criteria
     - Let them feel they're making the decisions (even if guided)
     - "Here are 3 approaches other companies use. Which fits your culture?"
  
  4. QUANTIFY COST OF INACTION
     - "Every month of delay costs $X in competitive positioning"
     - Make the status quo feel expensive and risky
  
  5. IDENTIFY THE INTERNAL CHAMPION
     - Who will advocate for this internally? (Usually not the CEO)
     - Frame recommendations to make THEM look smart
     - "Your VP of Operations could position this as solving the Q3 bottleneck"
  
  6. MAKE YEAR 1 FEEL ACHIEVABLE
     - Frame as "AI hygiene + 2 competitive necessities"
     - Everything else is "sequenced optionality"
     - Reduces perceived risk and ambition
  
  7. MATCH THEIR RISK POSTURE
     - Risk-averse companies: Lead with risk containment, not upside
     - Growth companies: Lead with competitive advantage
     - The Strategic Overview report reveals which they are
  
  STRUCTURE:
  - Present the BEST strategic ideas (what they should actually do)
  - Frame each idea with adoption psychology (how to make it happen)
  - Include stakeholder analysis (who needs to champion this)
  - Provide ready-to-use framing (how the champion should pitch it internally)
  
  The output should be: "Here's what they should do AND here's how to make it happen."
  - Workshop Design (co-creation agenda)
  - Champion Enablement (ghostwriting templates)
  
  TONE: You're writing BOTH:
  1. The strategic recommendations (show expertise, demonstrate what's possible)
  2. The conversation script (facilitate them owning it)
  
  Without great ideas, there's nothing to facilitate. Without facilitation, great ideas
  get scrutinized as "vendor pitches." You need both.

context_instructions: |
  You have access to context in the File Search Store. USE IT EXTENSIVELY.
  
  PRIMARY SOURCE - STRATEGIC COMPANY REPORT:
  Your File Search Store contains a comprehensive strategic analysis of this company
  (typically 15,000-20,000 words). This is your PRIMARY source. It includes:
  - Executive Summary and company overview
  - Products/Services and Target Customers analysis
  - Competitive Differentiation and Financial Profile
  - SWOT Analysis and Strategic Tensions
  - Porter's Five Forces and Value Chain Analysis
  - "Where They're Likely to Say Yes" - specific engagement opportunities
  - Discovery Questions already identified
  
  READ THIS REPORT THOROUGHLY before writing. Every AI recommendation must connect
  to specific insights from this strategic analysis. The report has already done
  the hard work of understanding this company - build on it, don't ignore it.
  
  SECONDARY SOURCE - VENDOR RESEARCH:
  Current information about cloud AI services (Azure, AWS, or GCP depending on
  --cloud-vendor flag). Use this for accurate technology recommendations with
  proper service names, pricing context, and capability details.
  
  HOW TO USE CONTEXT:
  - Search the strategic report for relevant sections before writing each part
  - Quote or reference specific findings: "The strategic analysis notes that..."
  - Connect AI opportunities to tensions/patterns already identified in the report
  - Use the "Where They're Likely to Say Yes" section to inform Quick Wins
  - Don't repeat generic AI advice - make it specific to THIS company's situation
  
  BAD: "They could use AI for customer service"
  GOOD: "Given their 45,000+ client base and emphasis on the 'Open and Connected' 
  ecosystem [from strategic report], an AI-powered integration assistant could 
  reduce the support burden of maintaining 400+ partner APIs"

# =============================================================================
# WRITING QUALITY STANDARDS
# =============================================================================

writing_standards: |
  SECTION-APPROPRIATE TONE:
  
  For OBSERVATION sections (Current State, Competitive Landscape):
  - Humble and exploratory: "Based on public signals, we hypothesize..."
  - Surface questions to validate in conversation
  - Acknowledge what we can't know from outside
  
  For FRAMEWORK sections (Prioritization Filters, ROI Models, Governance, Architecture):
  - Apply frameworks rigorously - this is where structured thinking adds value
  - Prioritization matrices, governance tiers, ROI models are useful tools
  - Ground every assessment in specific evidence
  - Draw out implications - what does each finding suggest?
  
  For RECOMMENDATION sections (Quick Wins, Bigger Bets, Strategic Choices):
  - Frame as one perspective among many: "Here's one way to think about this..."
  - "This is just our take based on what we can see - you might see it differently"
  - Include specific technologies as examples, not prescriptions: "Something like Azure OpenAI could work here, though there are other options"
  - ROI as rough estimates: "Ballpark ROI might be 2-4× if our assumptions hold..."
  - Always acknowledge we might be wrong: "This assumes X, but if Y is true instead..."
  
  COMPETITIVE CLAIMS:
  - Use directional language: "materially faster", "order-of-magnitude improvement"
  - Avoid precise multiples that invite challenge: NOT "13× faster"
  - Frame as "directional threat" not precise measurement
  - Soften: "near-real-time decisions for certain segments" vs "instant decisioning"
  
  ROI AND INVESTMENT:
  - Present as ranges: "$2-4M investment" not "$3.2M"
  - Explicit assumptions: "Assuming 20% adoption in Year 1..."
  - Include uncertainty: "ROI of 2-4× over 18-24 months, depending on..."
  - For risk-averse organizations: emphasize risk avoidance alongside upside
  - Match the company's culture: aggressive companies want upside, conservative ones want downside protection
  
  VENDOR SPECIFICS:
  - Frame as "one perspective" not definitive recommendations: "From our research, something like..."
  - "This is just one way to think about it - there are other valid approaches..."
  - "Worth considering tools like Agent365, though other vendors have similar offerings"
  - Always acknowledge alternatives: "Azure/AWS/GCP all have versions of this..."
  - The goal is to spark thinking, not lock in decisions
  
  THROUGHOUT:
  - Specific over generic: actual product names, numbers, comparisons
  - Connected to THIS company's situation
  - No numbered section headings (use natural titles)
  - Cite sources and flag uncertainty

# =============================================================================
# DATA SOURCES
# =============================================================================
# These files are uploaded to File Search Store as context for Deep Research.
# The vendor field filters which files are used based on --cloud-vendor flag.

data_sources:
  - name: "vendor_research_azure"
    path: "docs/vendor-research-azure-2025-12.txt"
    description: "Latest Azure AI services and capabilities from Microsoft Ignite 2024/2025"
    vendor: "azure"
    required: false
  - name: "vendor_research_aws"
    path: "docs/vendor-research-aws-2025-12.txt"
    description: "Latest AWS AI services and capabilities from re:Invent 2024"
    vendor: "aws"
    required: false
  - name: "vendor_research_gcp"
    path: "docs/vendor-research-gcp-2025-12.txt"
    description: "Latest GCP AI services and capabilities from Google Cloud Next 2024"
    vendor: "gcp"
    required: false
  - name: "vendor_research_agnostic"
    path: "docs/vendor-research-agnostic-2025-12.txt"
