# Opt-in local hooks. CI remains the authoritative hard gate; these give
# contributors fast feedback before pushing. Install with:
#   uv run pre-commit install      (or: pre-commit install)
#
# The one-time tree-wide `ruff format` reflow has landed, so format-check is now
# enforced here and in CI (a new file/edit must already be ruff-formatted).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format check)
        args: ["--check"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (src)
        files: ^src/primr/
        args: ["--ignore-missing-imports", "--disable-error-code=import-untyped"]
        additional_dependencies: []
