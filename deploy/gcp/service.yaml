# Cloud Run service configuration for Primr control plane API
# Scale-to-zero configuration with service account binding
# Requirements: 7.1, 7.7
#
# NOTE: no securityContext block here on purpose. Cloud Run fully managed does
# not expose securityContext in its v1 YAML schema (runAsNonRoot is unsupported;
# adding it is rejected by `gcloud run services replace`). Non-root execution is
# enforced by the runtime image instead — deploy/Dockerfile runs `USER primr`
# (uid 1000), which Cloud Run honors. Trivy's KSV0118 flags the missing
# securityContext as a generic-Kubernetes false-positive; it is justified-ignored
# in .trivyignore. Do not add a securityContext here — it will break the deploy.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: primr-api
  labels:
    app: primr
    component: api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: primr-api@{project}.iam.gserviceaccount.com
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - image: "{region}-docker.pkg.dev/{project}/{repo}/primr-api:{deployment}"
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: DEPLOYMENT
              value: "{deployment}"
            - name: GCP_PROJECT
              value: "{project}"
            - name: FIRESTORE_DATABASE
              value: "(default)"
            - name: GCS_BUCKET
              value: "{bucket}"
