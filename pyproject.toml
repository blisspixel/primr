[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primr"
version = "1.27.1"
description = "Turn any company or organization URL into a strategic intelligence brief. Adaptive scraping + AI-powered research and synthesis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nick Seal", email = "nick@pueo.io"}
]
keywords = ["ai", "research", "company", "intelligence", "gemini", "grok", "report", "analysis", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# Lower bounds reflect the minimum versions primr is tested against (kept in
# sync with requirements.txt). No upper caps except where a dependency has
# made known-breaking changes (see [project.optional-dependencies].a2a) — hard
# caps on a library cause resolution conflicts for downstream consumers.
dependencies = [
    "google-genai>=1.55.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fpdf>=1.7.2",
    "python-docx>=0.8.11",
    "pymupdf>=1.23.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "markdown>=3.4.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx[http2]>=0.24.0",
    "playwright>=1.40.0",
    "patchright",
    "docx2pdf>=0.1.8",
    "pyyaml>=6.0.0",
    "curl_cffi>=0.5.0",
    "DrissionPage>=4.0.0",
    "ddgs>=9.0.0",
    "mcp>=1.0.0",
    "defusedxml",
    "typer>=0.9.0",
    "starlette>=0.27.0",
    "uvicorn>=0.20.0",
    "recon-tool>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.15.5,<0.16.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.5.0",
]
api = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
]
fast = [
    "openai>=1.0.0",
]
a2a = [
    # Pinned to 0.3.x: a2a-sdk 1.0 made breaking API changes (TaskStore.list,
    # DefaultRequestHandler now requires agent_card, TaskStatusUpdateEvent
    # dropped final=, several type kwargs renamed). Upgrading the pin requires
    # reworking src/primr/a2a/{executor,server,task_store,agent_card}.py.
    "a2a-sdk[http-server]>=0.3.20,<0.4.0",
]
security = [
    "bandit>=1.7.0",
]
azure = [
    "azure-cosmos>=4.5.0",
    "azure-storage-blob>=12.19.0",
    "azure-servicebus>=7.11.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "opencensus-ext-azure>=1.1.0",
]

[project.scripts]
primr = "primr.core.cli:main"
primr-mcp = "primr.mcp_server.cli:main"
primr-a2a = "primr.a2a.cli:main"

[project.urls]
Homepage = "https://github.com/blisspixel/primr"
Documentation = "https://github.com/blisspixel/primr#readme"
Repository = "https://github.com/blisspixel/primr"
"Bug Tracker" = "https://github.com/blisspixel/primr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
primr = [
    "py.typed",
    "config/*.json",
    "prompts/*.yaml",
    "prompts/shared/*.yaml",
    "prompts/strategies/*.yaml",
    "prompts/skill_pack/*.yaml",
    "skill_pack/archetypes/*.yaml",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]  # Don't require stubs for all libraries
# Enable stricter checks - code has been improved to support these
check_untyped_defs = true
disallow_untyped_defs = false  # Enable incrementally per-module
no_implicit_optional = true
strict_optional = true
# Per-module overrides for stricter checking on well-typed modules
[[tool.mypy.overrides]]
module = [
    "primr.types",
    "primr.utils.errors",
    "primr.utils.circuit_breaker",
    "primr.agentic.hooks",
    "primr.agentic.errors",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # Line too long
    "E402",   # Module level import not at top (intentional lazy imports)
    "UP017",  # Allow timezone.utc for broader compatibility
    "UP042",  # Prefer StrEnum - requires larger refactor
    "N802",   # Function name should be lowercase (intentional for color constants)
    "N806",   # Variable in function should be lowercase (intentional for constants)
    "SIM108", # Use ternary operator - sometimes less readable
    "SIM102", # Nested ifs - sometimes more readable than combined condition
    "SIM105", # contextlib.suppress - explicit try/except sometimes clearer
    "SIM116", # dict instead of if-else - style preference
    "PT011",  # pytest.raises too broad - acceptable for some tests
    "RUF001", # Ambiguous unicode - intentional in regex for real-world matching
    "RUF012", # ClassVar for class attrs - verbose, doesn't affect correctness
    "RUF059", # Unused unpacked variable - sometimes clearer to show structure
    "TC001",  # Move first-party imports into type-checking block - false positives on runtime use
    "TC003",  # Move stdlib imports into type-checking block - false positives on runtime use
    "PT006",  # parametrize first arg should be tuple - stylistic, comma-separated works
]

[tool.ruff.lint.isort]
known-first-party = ["primr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
markers = [
    "integration: tests that make real API calls (require valid API keys)",
    "slow: tests that take a long time to run",
    "smoke: marks CLI smoke tests for quick validation",
    "resilience: marks API resilience and retry behavior tests",
    "manual: marks tests that require manual setup or real data files",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap:241",
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:The recursion limit will not be reset:hypothesis.errors.HypothesisWarning",
    "ignore:coroutine 'BaseApiClient.aclose' was never awaited:RuntimeWarning",
]


