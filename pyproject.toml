[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primr"
version = "1.1.2"
description = "AI-powered company research and report generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nick Seal", email = "nick@pueo.io"}
]
keywords = ["ai", "research", "company", "report", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Business/Professionals",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-genai>=1.55.0",
    "requests",
    "beautifulsoup4",
    "fpdf",
    "python-docx",
    "pymupdf",
    "pandas",
    "openpyxl",
    "pytesseract",
    "markdown",
    "colorama",
    "python-dotenv",
    "httpx[http2]",
    "playwright",
    "docx2pdf",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
]
api = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn",
]

[project.scripts]
primr = "primr.core.cli:main"

[project.urls]
Homepage = "https://github.com/blisspixel/primr"
Documentation = "https://github.com/blisspixel/primr#readme"
Repository = "https://github.com/blisspixel/primr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
primr = ["py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
