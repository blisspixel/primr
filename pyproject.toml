[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primr"
version = "1.39.8"
description = "Turn any company or organization URL into a strategic intelligence brief. Adaptive scraping + AI-powered research and synthesis."
readme = "README.md"
license = "Apache-2.0"
# Floor is 3.12 (EOL-driven): 3.10 reaches EOL Oct 2026 and 3.11 Oct 2027,
# while 3.12 carries security support to Oct 2028. Standardizing above the
# soon-to-be-legacy line removes legacy codepaths and aligns with the
# ecosystem. See ROADMAP "Engineering Standards & Toolchain".
requires-python = ">=3.12"
authors = [
    {name = "Nick Seal", email = "nick@pueo.io"}
]
keywords = ["ai", "research", "company", "intelligence", "gemini", "grok", "report", "analysis", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# Lower bounds reflect the minimum versions primr is tested against. This array
# (together with uv.lock) is the single source of dependency truth — there is
# deliberately no requirements.txt. No upper caps except where a dependency has
# made known-breaking changes (see [project.optional-dependencies].a2a) — hard
# caps on a library cause resolution conflicts for downstream consumers.
dependencies = [
    "google-genai>=2.3.0",
    # The default pipeline routes reasoning through xAI/Grok, which - like
    # OpenAI and Ollama - speaks the OpenAI chat-completions protocol via the
    # `openai` SDK (see ai/providers/openai_compatible.py). It is therefore a
    # core runtime requirement, not an optional add-on.
    "openai>=1.0.0",
    "requests>=2.34.0",
    # Directly used for IDNA 2008 hostname canonicalization. Keeping Unicode
    # domains in ASCII form prevents faß.de/fass.de case-fold collisions at
    # first-party filtering boundaries.
    "idna>=3.7",
    "beautifulsoup4>=4.12.0",
    "fpdf>=1.7.2",
    "python-docx>=0.8.11",
    "pymupdf>=1.23.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "markdown>=3.4.0",
    # Directly parses model-authored CommonMark at the executable-content
    # boundary. Do not rely on Rich's transitive dependency for this control.
    "markdown-it-py>=4.0.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx[http2]>=0.24.0",
    "playwright>=1.40.0",
    "patchright",
    "docx2pdf>=0.1.8",
    "pyyaml>=6.0.0",
    "curl_cffi>=0.5.0",
    "DrissionPage>=4.0.0",
    "ddgs>=9.0.0",
    # MCP SDK v2 speaks spec revision 2026-07-28 natively and still answers the
    # legacy initialize handshake; <3 guards against the next major rework.
    "mcp>=2.0.0,<3",
    "defusedxml",
    "typer>=0.9.0",
    # Security floor (DoS, CVE-2026-54282/54283): form-parsing limits silently
    # ignored on application/x-www-form-urlencoded. Floor raised above 1.2.x.
    "starlette>=1.3.1",
    "uvicorn>=0.20.0",
    "recon-tool>=1.3.1",
    # Security floors for otherwise-transitive deps, pinned so the resolver can
    # never select a known-vulnerable version on any install path:
    #   cryptography      GHSA-537c-gmf6-5ccf / CVE-2026-69247 (need ≥50.0.0)
    #   h2                PYSEC-2026-3628
    #   python-multipart  CVE-2026-53538/53539/53540  quadratic-time DoS
    #   msgpack           GHSA-6v7p-g79w-8964
    #   pydantic-settings GHSA-4xgf-cpjx-pc3j
    #   pillow            PYSEC-2026-2253 through PYSEC-2026-2257
    "cryptography>=50.0.0",
    "h2>=4.4.1",
    "python-multipart>=0.0.31",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "jsonschema>=4.0.0",
    "mypy>=1.0.0",
    "types-PyYAML",
    "ruff>=0.15.5,<0.16.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.5.0",
]
api = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
]
fast = [
    # Back-compat alias: `openai` is now a core dependency (the default Grok
    # pipeline needs it), so `primr[fast]` resolves to an already-satisfied set.
    # Kept so existing `pip install primr[fast]` invocations don't error.
    "openai>=1.0.0",
]
anthropic = [
    # Optional: enables the Anthropic Claude provider (reasoning/writing/pro).
    # `primr doctor` flags a set ANTHROPIC_API_KEY whose SDK is missing and can
    # install this for you. The July 2026 floor is needed for current Messages
    # request fields such as output_config.effort and adaptive thinking config.
    "anthropic>=0.109.1",
]
bedrock = [
    # Optional: enables the Amazon Bedrock provider via the boto3 bedrock-runtime
    # `converse` API (provider-agnostic). Auth uses the standard AWS credential
    # chain (AWS_ACCESS_KEY_ID/SECRET/REGION or AWS_PROFILE) or a Bedrock API key
    # (AWS_BEARER_TOKEN_BEDROCK). Foundry needs no extra — it reuses the core
    # `openai` SDK against Azure's OpenAI-compatible /openai/v1/ endpoint.
    "boto3>=1.40.0",
]
a2a = [
    # Pinned to 0.3.x: a2a-sdk 1.0 made breaking API changes (TaskStore.list,
    # DefaultRequestHandler now requires agent_card, TaskStatusUpdateEvent
    # dropped final=, several type kwargs renamed). Upgrading the pin requires
    # reworking src/primr/a2a/{executor,server,task_store,agent_card}.py.
    "a2a-sdk[http-server]>=0.3.20,<0.4.0",
]
security = [
    "bandit>=1.7.0",
]
azure = [
    "azure-cosmos>=4.5.0",
    "azure-storage-blob>=12.19.0",
    "azure-servicebus>=7.11.0",
    # Security floor (GHSA-m5vv-6r4h-3vj9, elevation of privilege): patched in 1.16.1.
    "azure-identity>=1.16.1",
    "azure-keyvault-secrets>=4.7.0",
    "opencensus-ext-azure>=1.1.0",
]
docs = [
    # Documentation site (mkdocs-material on GitHub Pages). Intentionally
    # lightweight — it renders the existing docs/*.md prose and does NOT import
    # the primr package, so the docs build stays fast and free of the native
    # runtime stack (playwright/pymupdf/curl_cffi).
    "mkdocs-material>=9.5.0",
    # Security floor (CVE-2026-61632): patched in 11.0.0.
    "pymdown-extensions>=11.0.0",
]

[dependency-groups]
release = [
    "build>=1.2.2",
    "cyclonedx-bom>=7.0.0",
    "setuptools>=77.0",
    "twine>=6.1.0",
    "wheel>=0.45.0",
]

[project.scripts]
primr = "primr.cli_entry:main"
primr-mcp = "primr.mcp_server.cli:main"
primr-a2a = "primr.a2a.cli:main"

[project.urls]
Homepage = "https://github.com/blisspixel/primr"
Documentation = "https://github.com/blisspixel/primr#readme"
Repository = "https://github.com/blisspixel/primr"
"Bug Tracker" = "https://github.com/blisspixel/primr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
primr = [
    "py.typed",
    "config/*.json",
    "prompts/*.yaml",
    "prompts/shared/*.yaml",
    "prompts/strategies/*.yaml",
    "prompts/skill_pack/*.yaml",
    "skill_pack/archetypes/*.yaml",
    "resources/skills/primr-zero/SKILL.md",
    "resources/skills/primr-zero/agents/*.yaml",
    "resources/skills/primr-zero/references/*.md",
    "resources/eval/*.json",
]

# mypy configuration lives in mypy.ini (authoritative; mypy ignores a
# [tool.mypy] block here when mypy.ini is present). Edit strictness, the
# per-module ignore list, and the strict allowlist there, not here. This
# avoids the two-config drift trap (the prior [tool.mypy] block was dead
# config that never took effect).

[tool.ruff]
line-length = 100
# Matches the supported floor (requires-python >= 3.12) so pyupgrade (UP) keeps
# the codebase on modern 3.12+ idioms.
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity budget (roadmap #23 endgame)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # Line too long
    "E402",   # Module level import not at top (intentional lazy imports)
    "UP017",  # Allow timezone.utc for broader compatibility
    "UP042",  # Prefer StrEnum - requires larger refactor
    "UP046",  # PEP 695 generic class - migration deferred (TypeVar generics are
    "UP047",  # PEP 695 generic function - correct; bulk unsafe-rewrite not worth the risk now

    "N802",   # Function name should be lowercase (intentional for color constants)
    "N806",   # Variable in function should be lowercase (intentional for constants)
    "SIM108", # Use ternary operator - sometimes less readable
    "SIM102", # Nested ifs - sometimes more readable than combined condition
    "SIM105", # contextlib.suppress - explicit try/except sometimes clearer
    "SIM116", # dict instead of if-else - style preference
    "PT011",  # pytest.raises too broad - acceptable for some tests
    "RUF001", # Ambiguous unicode - intentional in regex for real-world matching
    "RUF012", # ClassVar for class attrs - verbose, doesn't affect correctness
    "RUF059", # Unused unpacked variable - sometimes clearer to show structure
    "TC001",  # Move first-party imports into type-checking block - false positives on runtime use
    "TC003",  # Move stdlib imports into type-checking block - false positives on runtime use
    "PT006",  # parametrize first arg should be tuple - stylistic, comma-separated works
]

[tool.ruff.lint.isort]
known-first-party = ["primr"]

# Complexity budget (roadmap #23 endgame): no new function above cyclomatic
# complexity 25 — the anti-monster invariant the perform_fast_research
# refactor established. 25 (not 10) because verbatim pipeline/orchestration
# code is inherently branchy: at 10 even the freshly extracted stage modules
# violate (171 functions across 91 files), which is noise; at 25 the gate
# catches exactly the monsters. The per-file-ignores below grandfather the
# 19 existing functions over 25 (worst: fetch_web_content at 117, documented
# as the intentionally-monolithic ONE scraping function). This list must only
# SHRINK — when a grandfathered file's functions drop to <= 25, remove its
# entry. Never add a file here for new code.
[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"src/primr/agentic/orchestrator.py" = ["C901"]
"src/primr/ai/deep_research.py" = ["C901"]
"src/primr/core/ai_strategy_runtime.py" = ["C901"]
"src/primr/core/cli.py" = ["C901"]
"src/primr/core/fast_run_strategy.py" = ["C901"]
"src/primr/core/fast_run_validation.py" = ["C901"]
"src/primr/core/recon_context.py" = ["C901"]
"src/primr/core/research_agent.py" = ["C901"]
"src/primr/core/strategy_artifacts.py" = ["C901"]
"src/primr/data/scrape.py" = ["C901"]
"src/primr/data/scraping/detection.py" = ["C901"]
"src/primr/data/scraping/discovery.py" = ["C901"]
"src/primr/data/scraping/orchestrator.py" = ["C901"]
"src/primr/data/scraping/page_access.py" = ["C901"]
"src/primr/skill_pack/cli.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
# No silent xfail rot: an xfail that unexpectedly passes (XPASS) fails the run.
# The codebase currently uses zero xfail markers — this keeps it that way.
xfail_strict = true
markers = [
    "integration: tests that make real API calls (require valid API keys)",
    "timing: wall-clock-sensitive tests (excluded from the cross-platform CI legs, which validate portability, not performance; they still run on the Linux matrix)",
    "slow: tests that take a long time to run",
    "smoke: marks CLI smoke tests for quick validation",
    "resilience: marks API resilience and retry behavior tests",
    "manual: marks tests that require manual setup or real data files",
    "timeout: marks tests with an explicit runtime ceiling when pytest-timeout is installed",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap:241",
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:The recursion limit will not be reset:hypothesis.errors.HypothesisWarning",
    "ignore:coroutine 'BaseApiClient.aclose' was never awaited:RuntimeWarning",
]


