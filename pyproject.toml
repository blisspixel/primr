[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primr"
version = "1.3.0"
description = "Company intelligence research tool using Google Gemini - generates structured briefs from website content and external sources"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nick Seal", email = "nick@pueo.io"}
]
keywords = ["ai", "research", "company", "intelligence", "gemini", "report", "analysis", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "google-genai>=1.55.0",
    "requests",
    "beautifulsoup4",
    "fpdf",
    "python-docx",
    "pymupdf",
    "pandas",
    "openpyxl",
    "pytesseract",
    "markdown",
    "colorama",
    "python-dotenv",
    "httpx[http2]",
    "playwright",
    "docx2pdf",
    "pyyaml",
    "curl_cffi",
    "DrissionPage",
    "mcp>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
api = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
]
security = [
    "bandit>=1.7.0",
]

[project.scripts]
primr = "primr.core.cli:main"
primr-mcp = "primr.mcp_server.cli:main"

[project.urls]
Homepage = "https://github.com/blisspixel/primr"
Documentation = "https://github.com/blisspixel/primr#readme"
Repository = "https://github.com/blisspixel/primr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
primr = ["py.typed"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
