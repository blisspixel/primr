<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>primr demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #161b22;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .window {
    width: 920px;
    background: #0d1117;
    border-radius: 10px;
    border: 1px solid #30363d;
    box-shadow: 0 24px 48px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .titlebar {
    height: 38px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .r { background: #ff5f57; }
  .y { background: #febc2e; }
  .g { background: #28c840; }
  .title {
    flex: 1;
    text-align: center;
    color: #8b949e;
    font-size: 12px;
    font-weight: 500;
  }
  .term {
    padding: 18px 20px 22px;
    font-family: "Cascadia Code", "Consolas", "SF Mono", "Menlo", monospace;
    font-size: 13px;
    line-height: 1.45;
    color: #c9d1d9;
    white-space: pre;
  }
  .prompt { color: #58a6ff; }
  .cmd { color: #e6edf3; }
  .muted { color: #8b949e; }
  .head { color: #79c0ff; font-weight: 600; }
  .ok { color: #3fb950; }
  .warn { color: #d29922; }
  .path { color: #a5d6ff; }
  .phase { color: #d2a8ff; }
  .dim { color: #6e7681; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
      <div class="title">primr · ExampleCo (demo)</div>
    </div>
    <div class="term" id="t"></div>
  </div>
<script>
const lines = [
  ['<span class="prompt">PS C:\\Users\\demo&gt;</span> <span class="cmd">primr "ExampleCo" https://example.co --dry-run</span>', ''],
  ['', ''],
  ['<span class="head">============================================================</span>', ''],
  ['<span class="head">COST ESTIMATE: full mode</span>', ''],
  ['<span class="head">============================================================</span>', ''],
  ['', ''],
  ['Mode: full', ''],
  ['Estimated Duration: 31-47 min', ''],
  ['Estimated Total: <span class="warn">$0.76</span>', ''],
  ['', ''],
  ['  Input:  ~1,915,000 tokens', 'muted'],
  ['  Output: ~103,500 tokens', 'muted'],
  ['', ''],
  ['<span class="head">RECON PRE-FLIGHT</span>', ''],
  ['  DNS intelligence lookup:  $0.00  (~2-3 seconds)', 'muted'],
  ['', ''],
  ['<span class="head">NEXT STEPS</span>', ''],
  ['  1. Launch: repeat this command without --dry-run', 'muted'],
  ['  2. Monitor: follow phase markers in this terminal', 'muted'],
  ['  3. Retrieve: artifact path printed when complete', 'muted'],
  ['', ''],
  ['<span class="head">============================================================</span>', ''],
  ['', ''],
  ['<span class="prompt">PS C:\\Users\\demo&gt;</span> <span class="cmd">primr "ExampleCo" https://example.co</span>', ''],
  ['', ''],
  ['<span class="cmd">ExampleCo</span>', ''],
  ['https://example.co', 'path'],
  ['----------------------------------------', 'dim'],
  ['Estimated: 31-47 min · <span class="warn">~$0.76</span>', ''],
  ['', ''],
  ['<span class="phase">Data Collection</span>', ''],
  ['Website scraping + public sources + analysis', 'muted'],
  ['Expected: 15-25 minutes', 'muted'],
  ['', ''],
  ['  Scraping https://example.co', ''],
  ['  <span class="ok">✓ 12 pages scraped (41s)</span>', ''],
  ['  + 6 external sources', 'muted'],
  ['  + Industry: B2B software (demo)', 'muted'],
  ['  Analyzing report sections...', ''],
  ['  [3/15] Mission &amp; Vision', 'muted'],
  ['  [4/15] Company History', 'muted'],
  ['  <span class="ok">✓ Data Collection (18m 12s)</span>', ''],
  ['', ''],
  ['<span class="phase">Deep Research</span>', ''],
  ['  Phase 1: Gathering research dossier...', 'muted'],
  ['  Research started', 'muted'],
  ['', ''],
  ['  <span class="dim">... a few minutes later</span>', ''],
  ['', ''],
  ['  <span class="ok">✓ Strategic Overview written</span>', ''],
  ['  <span class="ok">✓ AI Strategy module complete</span>', ''],
  ['  <span class="ok">✓ Complete in 42m 08s</span>', ''],
  ['', ''],
  ['  <span class="ok">✓ Report ready</span>', ''],
  ['     <span class="path">output\\exampleco\\ExampleCo_Strategic_Overview_08-01-2026.md</span>', ''],
  ['     <span class="path">output\\exampleco\\ExampleCo_Strategic_Overview_08-01-2026.docx</span>', ''],
  ['', ''],
  ['Mode: full  ·  Sections: 23  ·  Citations: 41', 'muted'],
  ['Est. Cost: $0.76  ·  Actual: ~$0.71', 'muted'],
];
const el = document.getElementById('t');
el.innerHTML = lines.map(([t, c]) => {
  if (!t) return '';
  if (c === 'muted') return `<span class="muted">${t}</span>`;
  if (c === 'path') return `<span class="path">${t}</span>`;
  if (c === 'dim') return `<span class="dim">${t}</span>`;
  return t;
}).join('\n');
</script>
</body>
</html>
