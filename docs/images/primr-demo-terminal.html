<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>primr demo (placeholder ExampleCo)</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #010409;
    --chrome: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --dim: #6e7681;
    --prompt: #79c0ff;
    --cyan: #39d353;
    --blue: #58a6ff;
    --purple: #d2a8ff;
    --yellow: #e3b341;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #010409;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .frame {
    width: 960px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 28px 60px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .titlebar {
    height: 40px;
    background: linear-gradient(180deg, #1c2128 0%, var(--chrome) 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
  }
  .traffic { display: flex; gap: 7px; width: 56px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: #ff5f57; }
  .y { background: #febc2e; }
  .g { background: #28c840; }
  .title {
    flex: 1;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .title strong { color: #c9d1d9; font-weight: 600; }
  .badge {
    font-size: 10px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .term {
    padding: 18px 22px 22px;
    font-family: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    font-size: 12.75px;
    line-height: 1.48;
    color: var(--text);
    background: var(--panel);
    white-space: pre;
  }
  .prompt { color: var(--prompt); }
  .cmd { color: var(--text); }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .head { color: var(--blue); font-weight: 600; }
  .ok { color: var(--green); }
  .warn { color: var(--yellow); }
  .phase { color: var(--purple); font-weight: 600; }
  .path { color: #a5d6ff; }
  .rule { color: #388bfd; }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: #58a6ff;
    margin-left: 2px;
    vertical-align: -2px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="frame" id="shot">
    <div class="titlebar">
      <div class="traffic">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
      </div>
      <div class="title"><strong>primr</strong> · ExampleCo demo · PowerShell</div>
      <div class="badge">placeholder data</div>
    </div>
    <div class="term" id="t"></div>
  </div>

</body>
</html>
