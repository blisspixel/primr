name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab — useful for the first release of an
  # already-tagged version, or for re-running a failed publish without
  # recreating the tag.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v1.20.0)'
        required: true
        default: 'v1.20.0'

# Strict semver regex applied to every tag/ref consumed by a shell step.
# Tag names can legally contain shell metacharacters (quotes, $, ;, #, braces)
# under git's refname rules, so any value pulled from github.ref or
# workflow_dispatch input MUST be validated before it touches bash.
env:
  TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest

    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          RAW_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          # Strip refs/tags/ prefix when triggered by tag push
          TAG="${RAW_REF#refs/tags/}"
          if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::Tag '$TAG' does not match required semver pattern $TAG_PATTERN"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          # Full history so setuptools-scm or anything reading commits works.
          fetch-depth: 0
          # We only need to read the tree; no push from this job.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version matches tag
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/primr
    permissions:
      # Required for trusted-publisher OIDC token exchange with PyPI.
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-pushing an already-tagged version (e.g. after a git history
          # rewrite that moves the tag) hits PyPI's immutable-version rule and
          # would otherwise fail with 400 File already exists. skip-existing
          # lets the workflow exit cleanly in that case — the wheels on PyPI
          # stay as the originally-published artifacts.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          RAW_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          TAG="${RAW_REF#refs/tags/}"
          if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::Tag '$TAG' does not match required semver pattern $TAG_PATTERN"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0
          # gh release uses GH_TOKEN env, not the checkout-persisted credential.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import re, os, pathlib
          version = os.environ["RELEASE_VERSION"]
          text = pathlib.Path("docs/CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", re.M | re.S)
          m = pat.search(text)
          body = (m.group(1).strip() if m else f"Release {version}.")
          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "RELEASE_NOTES.md"
          out.write_text(body, encoding="utf-8")
          print(f"Extracted {len(body)} chars of notes for {version}")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          # Opt-in escape hatch for the rare case where an operator
          # genuinely needs to replace release assets (e.g. a yanked
          # wheel). Default is fail-closed so a force-moved tag or a
          # re-dispatched workflow against altered code cannot silently
          # swap out artifacts that downstream consumers already trust.
          ALLOW_ASSET_REPLACE: ${{ vars.ALLOW_RELEASE_ASSET_REPLACE || 'false' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$ALLOW_ASSET_REPLACE" != "true" ]; then
              echo "::error::Release $TAG already exists. Refusing to replace assets."
              echo "::error::Same-version asset replacement is a supply-chain risk."
              echo "::error::To intentionally update notes/assets, set the"
              echo "::error::ALLOW_RELEASE_ASSET_REPLACE repository variable to true"
              echo "::error::or delete the release manually first."
              exit 1
            fi
            # Opt-in path: refresh notes and replace artifacts in place.
            echo "::warning::ALLOW_RELEASE_ASSET_REPLACE=true — replacing assets for $TAG"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          fi
