name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab — useful for the first release of an
  # already-tagged version, or for re-running a failed publish without
  # recreating the tag.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v1.20.0)'
        required: true
        default: 'v1.20.0'

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Full history so setuptools-scm or anything reading commits works.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version matches tag
        run: |
          TAG_REF="${{ github.event.inputs.ref || github.ref }}"
          # Strip refs/tags/ prefix when triggered by tag push
          TAG="${TAG_REF#refs/tags/}"
          # Strip leading v
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/primr
    permissions:
      # Required for trusted-publisher OIDC token exchange with PyPI.
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Resolve tag and version
        id: meta
        run: |
          TAG_REF="${{ github.event.inputs.ref || github.ref }}"
          TAG="${TAG_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          python - <<'PY' "${{ steps.meta.outputs.version }}"
          import re, sys, pathlib, os
          version = sys.argv[1]
          text = pathlib.Path("docs/CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", re.M | re.S)
          m = pat.search(text)
          body = (m.group(1).strip() if m else f"Release {version}.")
          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "RELEASE_NOTES.md"
          out.write_text(body, encoding="utf-8")
          print(f"Extracted {len(body)} chars of notes for {version}")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            dist/*
