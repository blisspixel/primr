name: CodeQL

# Semantic SAST (dataflow / taint analysis) for Python, complementing the
# pattern-based bandit gate and the Trivy / pip-audit supply-chain gates.
# Findings surface as code-scanning alerts in the Security tab; the analysis
# job itself succeeds even when alerts are raised, so this adds signal without
# blocking PRs (warn-then-hard, the same pattern Trivy followed).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1" # weekly, Monday 05:24 UTC

# A newer PR head supersedes its queued validation. Keep every main and
# scheduled run independent so release and default-branch evidence is retained.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF results to the code-scanning / Security tab.
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
          # Python is interpreted — no build step needed.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:python"
