name: Scheduled dependency security audit

on:
  schedule:
    - cron: "43 5 * * 1" # weekly, Monday 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-advisories:
    name: Python advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.15"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: emsign-fixed

      - name: Set up Python
        run: uv python install 3.15

      - name: Install locked audit environment
        run: uv sync --locked --all-extras

      - name: Audit installed dependencies
        run: uv run --no-sync pip-audit

  repository-supply-chain:
    name: Repository supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
