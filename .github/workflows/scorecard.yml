name: Scorecard supply-chain security

# OpenSSF Scorecard — an automated, external repo-health score (pinned
# dependencies, branch protection, token permissions, SAST, signed releases,
# etc.). Results publish to the Security tab and the public OpenSSF dataset so
# the README badge resolves. Runs on the default branch only — Scorecard scores
# the repository, not individual PRs.

on:
  workflow_dispatch:
  # Re-score when branch-protection / ruleset configuration changes.
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  push:
    branches: [main]

# Read-all at the top level; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Publish results to the public OpenSSF dataset (powers the badge).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish so the badge + public report resolve. The repo is already
          # public; this exposes only the computed score, not source.
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
