name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: lint-and-test (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # 3.12-3.13 are hard gates (3.12 is the supported floor through current stable).
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          # 3.14 is an experimental leg: allowed to fail until the native-dep
          # stack (playwright/pymupdf/curl_cffi/DrissionPage) is green on 3.14.
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra api --python ${{ matrix.python-version }}

      # Lint / type-check / security gates are version-independent, so run them
      # once on the primary interpreter to save matrix minutes.
      - name: Lint
        if: matrix.python-version == '3.13'
        run: uv run ruff check src/primr/

      - name: Type check
        if: matrix.python-version == '3.13'
        run: uv run mypy src/primr/ --ignore-missing-imports --disable-error-code=import-untyped --exclude 'src/primr/api/'

      - name: Security scan (bandit)
        if: matrix.python-version == '3.13'
        run: uv run bandit -r src/primr -c .bandit --severity-level medium --confidence-level medium -q

      - name: Dependency vulnerability audit (pip-audit)
        if: matrix.python-version == '3.13'
        # Audits the synced venv against the advisory DB. Add --ignore-vuln <ID>
        # here (with a comment) only for reviewed, non-actionable advisories.
        run: uv run pip-audit

      - name: Recovery Regression Suite
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run pytest -q \
            tests/test_core/test_resume_recovery.py \
            tests/test_core/test_research_agent_resume.py \
            tests/test_data/test_scrape_resume.py \
            --cov=primr.core.cli \
            --cov=primr.core.research_agent \
            --cov=primr.data.scrape \
            --cov-fail-under=13 \
            --cov-report=term

      - name: Test
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        # Global branch-coverage gate is a non-regression RATCHET (raise only,
        # never lower). It runs on the primary interpreter; the other matrix
        # legs run the suite without the coverage gate.
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            uv run pytest tests/ --ignore=tests/manual -x --tb=short -q \
              -k "not test_wait_times_out_when_no_change" -m "not integration" \
              --cov=src/primr --cov-branch --cov-fail-under=77
          else
            uv run pytest tests/ --ignore=tests/manual -x --tb=short -q \
              -k "not test_wait_times_out_when_no_change" -m "not integration"
          fi

      # Property tests live in tests/property_tests / tests/agentic/property_tests
      # and include the deploy/** hardcoded-secret scanner. A few pre-existing
      # hypothesis-found flakes need root-cause fixes before this can block
      # merges, so it produces signal but does not gate yet. Run once.
      - name: Property + security-gate tests
        if: matrix.python-version == '3.13'
        continue-on-error: true
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run pytest tests/property_tests tests/agentic/property_tests \
            --tb=short -q -m "not integration"

      # Hard-gated security slice: the deploy/** hardcoded-secret scanner cannot
      # silently regress while the model-selection property flake is fixed.
      - name: Security gate (hardcoded secret scan)
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run pytest tests/property_tests/test_no_hardcoded_secrets_properties.py \
            --tb=short -q

  a2a-tests:
    runs-on: ubuntu-latest
    name: A2A Integration Tests

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (with A2A SDK)
        run: uv sync --frozen --extra dev --extra api --extra a2a --python 3.13

      - name: A2A Tests
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: uv run pytest tests/a2a/ --ignore=tests/a2a/property_tests -x --tb=short -q
