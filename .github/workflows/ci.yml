name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check src/primr/

      - name: Type check
        run: mypy src/primr/ --ignore-missing-imports --disable-error-code=import-untyped --exclude 'src/primr/api/'

      - name: Recovery Regression Suite
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          pytest -q \
            tests/test_core/test_resume_recovery.py \
            tests/test_core/test_research_agent_resume.py \
            tests/test_data/test_scrape_resume.py \
            --cov=primr.core.cli \
            --cov=primr.core.research_agent \
            --cov=primr.data.scrape \
            --cov-fail-under=13 \
            --cov-report=term

      - name: Test
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: pytest tests/ --ignore=tests/manual --ignore=tests/test_qa -x --tb=short -q -k "not test_wait_times_out_when_no_change" -m "not integration"

      # Property tests live in tests/property_tests / tests/agentic/property_tests
      # and include the deploy/** hardcoded-secret scanner. They were previously
      # excluded from the main Test step to suppress collection failures; that
      # also disabled the security gate. Re-enable them here in a separate
      # step that produces signal but does not block merges yet — a few
      # pre-existing hypothesis-found flakes (e.g. ProviderAwareModelSelection)
      # need root-cause fixes before we can flip continue-on-error off.
      - name: Property + security-gate tests
        continue-on-error: true
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          pytest tests/property_tests tests/agentic/property_tests \
            --tb=short -q -m "not integration"

      # Run only the security-gate slice as a hard gate so the deploy/**
      # hardcoded-secret scanner cannot silently regress while the model
      # selection property flake is being fixed.
      - name: Security gate (hardcoded secret scan)
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          pytest tests/property_tests/test_no_hardcoded_secrets_properties.py \
            --tb=short -q

  a2a-tests:
    runs-on: ubuntu-latest
    name: A2A Integration Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-a2a-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies (with A2A SDK)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,a2a]"

      - name: A2A Tests
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: pytest tests/a2a/ --ignore=tests/a2a/property_tests -x --tb=short -q
