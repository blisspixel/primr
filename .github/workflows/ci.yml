name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: lint-and-test (py${{ matrix.python-version }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the supported floor; 3.13 and 3.14 are current/next stable.
        # All three are hard gates: the full suite runs on each and the
        # native-dependency stack must install cleanly on 3.14.
        python-version: ["3.12", "3.13", "3.14"]

    # UV_PYTHON pins the interpreter for every uv command in this job to the
    # matrix leg, so the install step and all `uv run --no-sync` steps agree on
    # one .venv. `uv run --no-sync` then reuses exactly what the install step
    # built (base + dev + api) instead of re-resolving and dropping extras.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ runner.os }}-py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        timeout-minutes: 10
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        timeout-minutes: 10
        # Includes the a2a extra so the 165 a2a tests run under the coverage
        # gate in this job (they importorskip without the SDK), instead of only
        # in the separate uncovered a2a-tests job, this counts the a2a package
        # in the global coverage ratchet.
        run: uv sync --locked --all-extras

      # Lint / type-check / security gates are version-independent, so run them
      # once on the primary interpreter to save matrix minutes.
      - name: Lint
        if: matrix.python-version == '3.13'
        run: uv run --no-sync ruff check src/primr/

      - name: Format check
        if: matrix.python-version == '3.13'
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Type check
        if: matrix.python-version == '3.13'
        run: uv run --no-sync mypy src/primr/ --ignore-missing-imports --disable-error-code=import-untyped --exclude 'src/primr/api/'

      - name: Build documentation strictly
        if: matrix.python-version == '3.13'
        run: uv run --no-sync mkdocs build --strict

      - name: Security scan (bandit)
        if: matrix.python-version == '3.13'
        run: uv run --no-sync bandit -r src/primr -c .bandit --severity-level medium --confidence-level medium -q

      - name: Dependency vulnerability audit (pip-audit)
        if: matrix.python-version == '3.13'
        # Audits the synced venv against the advisory DB. Add --ignore-vuln <ID>
        # here (with a comment) only for reviewed, non-actionable advisories.
        run: uv run --no-sync pip-audit

      - name: Build and inspect source distribution
        timeout-minutes: 5
        if: matrix.python-version == '3.13'
        env:
          PRIMR_VALIDATE_SDIST: "1"
        run: uv run --no-sync pytest tests/test_release_integrity.py::test_built_sdist_matches_release_inventory -q

      - name: Recovery Regression Suite
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest -q \
            tests/test_core/test_resume_recovery.py \
            tests/test_core/test_research_agent_resume.py \
            tests/test_data/test_scrape_resume.py \
            --cov=primr.core.cli \
            --cov=primr.core.research_agent \
            --cov=primr.data.scrape \
            --cov-fail-under=13 \
            --cov-report=term

      - name: Test (non-primary interpreters)
        timeout-minutes: 25
        if: matrix.python-version != '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest tests/ --ignore=tests/manual -x --tb=short -q \
            -k "not test_wait_times_out_when_no_change" -m "not integration"

      # The primary suite is divided only at the CI orchestration boundary.
      # Every shard appends branch data to one coverage database, and the final
      # report enforces the global non-regression ratchet across the full suite.
      # This preserves scope while keeping each step below the hosted timeout.
      - name: Test with coverage (agent protocols)
        timeout-minutes: 12
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync coverage erase
          uv run --no-sync pytest \
            tests/a2a tests/mcp_server tests/openclaw tests/security tests/skill_pack \
            -x --tb=short -q \
            -k "not test_wait_times_out_when_no_change" -m "not integration" \
            --cov=src/primr --cov-branch --cov-append --cov-report=

      - name: Test with coverage (agentic and property)
        timeout-minutes: 12
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest tests/agentic tests/property_tests \
            -x --tb=short -q \
            -k "not test_wait_times_out_when_no_change" -m "not integration" \
            --cov=src/primr --cov-branch --cov-append --cov-report=

      - name: Test with coverage (providers and configuration)
        timeout-minutes: 12
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest tests/test_ai tests/test_api tests/test_config \
            -x --tb=short -q \
            -k "not test_wait_times_out_when_no_change" -m "not integration" \
            --cov=src/primr --cov-branch --cov-append --cov-report=

      - name: Test with coverage (core)
        timeout-minutes: 12
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest tests/test_core \
            -x --tb=short -q \
            -k "not test_wait_times_out_when_no_change" -m "not integration" \
            --cov=src/primr --cov-branch --cov-append --cov-report=

      - name: Test with coverage (remaining suite)
        timeout-minutes: 12
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest \
            tests/test_data tests/test_deploy tests/test_lifecycle tests/test_output \
            tests/test_pipeline tests/test_prompts tests/test_qa tests/test_scripts \
            tests/test_utils tests/test_*.py \
            -x --tb=short -q \
            -k "not test_wait_times_out_when_no_change" -m "not integration" \
            --cov=src/primr --cov-branch --cov-append --cov-report=

      - name: Enforce global branch coverage
        if: matrix.python-version == '3.13'
        run: uv run --no-sync coverage report --fail-under=81

      # Keep this security invariant visible as a dedicated hard gate even though
      # the same test also contributes to the combined coverage result above.
      - name: Security gate (hardcoded secret scan)
        timeout-minutes: 5
        if: matrix.python-version == '3.13'
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          uv run --no-sync pytest tests/property_tests/test_no_hardcoded_secrets_properties.py \
            --tb=short -q

  cross-platform-test:
    # primr advertises Windows + macOS + Linux support; the matrix above only
    # exercises Linux. This job enforces the claim by running the portable test
    # suite on Windows and macOS (Python 3.13, the primary interpreter).
    # OS-independent gates (lint, mypy, security, coverage) deliberately stay on
    # the Linux job. Only correctness is re-checked here. No browser install:
    # the suite mocks/skips the browser scraping tiers, so no Playwright download
    # is needed (matching the Linux Test step).
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ runner.os }}-py3.13-cross-platform

      - name: Set up Python 3.13
        timeout-minutes: 10
        run: uv python install 3.13

      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync --locked --extra dev --extra api --extra a2a

      - name: Test
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        # Timing-sensitive tests are excluded here: the cross-platform legs
        # validate portability, not wall-clock performance, and tight timing
        # bounds flake on slower/shared runners. They still run on the Linux
        # matrix above.
        run: uv run --no-sync pytest tests/ --ignore=tests/manual --tb=short -q -k "not test_wait_times_out_when_no_change" -m "not integration and not timing"

  a2a-tests:
    runs-on: ubuntu-latest
    name: A2A Integration Tests
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ runner.os }}-py3.13-a2a

      - name: Set up Python 3.13
        timeout-minutes: 10
        run: uv python install 3.13

      - name: Install dependencies (with A2A SDK)
        timeout-minutes: 10
        run: uv sync --locked --extra dev --extra api --extra a2a

      - name: A2A Tests
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: uv run --no-sync pytest tests/a2a/ --ignore=tests/a2a/property_tests -x --tb=short -q

  # Supply-chain scan (Trivy): filesystem vuln + misconfig scan.
  # HARD GATE: the baseline is clean (the only misconfig finding, KSV0118 on the
  # Cloud Run manifests, is a documented platform false-positive justified-ignored
  # in .trivyignore, see that file), so this blocks on any new HIGH/CRITICAL
  # fixable vuln or misconfig. Complements the pip-audit + bandit hard gates.
  # Dependency bumps this gate demands are applied by hand after review.
  supply-chain-scan:
    runs-on: ubuntu-latest
    name: Supply-chain scan (Trivy)
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          # vuln + misconfig only. Secret scanning is intentionally omitted:
          # it flags the deliberate fake keys/tokens in test fixtures, and primr
          # already hard-gates real secret leaks via the hardcoded-secret
          # property test (tests/property_tests/test_no_hardcoded_secrets_properties.py).
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container-builds:
    runs-on: ubuntu-latest
    name: Production container builds
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Build job runner image
        run: docker build --file deploy/Dockerfile --tag primr-job-runner:ci .

      - name: Smoke test job runner imports
        run: >-
          docker run --rm --entrypoint python primr-job-runner:ci
          -c "import primr; import deploy.runner; import deploy.storage"

      - name: Build OpenClaw MCP image
        run: |
          context="$RUNNER_TEMP/primr-openclaw-context"
          mkdir -p "$context/deploy"
          cp -R openclaw/. "$context/"
          cp pyproject.toml MANIFEST.in README.md "$context/"
          cp -R src "$context/src"
          cp deploy/build-requirements.lock deploy/runtime-requirements.lock "$context/deploy/"
          docker build --file "$context/Dockerfile.primr" --tag primr-openclaw:ci "$context"

      - name: Smoke test OpenClaw CLI entry points
        run: >-
          docker run --rm --entrypoint sh primr-openclaw:ci
          -c "primr --version && primr-mcp --help >/dev/null"
