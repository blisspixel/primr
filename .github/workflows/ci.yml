name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check src/primr/

      - name: Type check
        run: mypy src/primr/ --ignore-missing-imports --disable-error-code=import-untyped --exclude 'src/primr/api/'

      - name: Recovery Regression Suite
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: |
          pytest -q \
            tests/test_core/test_resume_recovery.py \
            tests/test_core/test_research_agent_resume.py \
            tests/test_data/test_scrape_resume.py \
            --cov=primr.core.cli \
            --cov=primr.core.research_agent \
            --cov=primr.data.scrape \
            --cov-fail-under=14 \
            --cov-report=term

      - name: Test
        env:
          GEMINI_API_KEY: fake-key-for-ci-tests
        run: pytest tests/ --ignore=tests/manual --ignore=tests/test_output --ignore=tests/property_tests --ignore=tests/agentic/property_tests --ignore=tests/test_qa -x --tb=short -q -k "not test_wait_times_out_when_no_change" -m "not integration"
