version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /deploy
      - /openclaw
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      containers-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
