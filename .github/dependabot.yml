version: 2
updates:
  # Keep GitHub branch-clean by default. Raise this intentionally when running
  # a dependency update sweep.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
